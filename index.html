function homePage(){return `<button class="glass weather" data-action="weather"><div class="weather-main"><div class="weather-art">${icon(weather?.rain?'umbrella':'cloud')}</div><div class="weather-info"><div class="weather-title">${icon('pin')} 目前位置天氣</div><div class="temp">${weather?Math.round(weather.current.temperature_2m)+'°':'--°'}</div><div class="muted">${weather?'降雨 '+(weather.rainChance??'--')+'% · 風速 '+weather.current.wind_speed_10m+' km/h':weatherError||(locationBusy?'正在取得位置…':loc?'正在取得天氣…':'點擊啟用定位與天氣')}</div></div></div>${weatherDetails?`<div class="notice">天氣資訊僅供參考，官方警告請查看日本氣象廳。</div>`:''}</button><div class="quick">${[['trip','calendar','行程'],['nearby','map','附近'],['receipts','receipt','收據'],['settings','settings','設定']].map(([p,ic,n])=>`<button data-page="${p}">${icon(ic)}${n}</button>`).join('')}</div><section class="glass"><div class="row between"><span class="heading">${icon('calendar')} 今日行程</span><button class="btn" data-page="trip">查看全部</button></div><div class="muted" style="margin:9px 0">${escapeHtml(data.days[day]?.date||'')} · ${escapeHtml(data.days[day]?.name||'')}</div>${(data.days[day]?.stops||[]).slice(0,2).map(s=>`<div class="mini"><b>${escapeHtml(s.time)} · ${escapeHtml(s.name)}</b></div>`).join('')||'<p class="muted">未有行程</p>'}</section><section class="glass"><div class="row between"><span class="heading">${icon('map')} 附近探索</span>${button('開啟地圖','nearby')}</div><p class="muted">Google 地圖預覽，下方列出附近店舖、地址與直線距離。</p></section><section class="glass"><div class="row between"><span class="heading">${icon('receipt')} Tax-Free 收據夾</span>${button('快速拍照','capture')}</div><p class="muted">收據照片可以直接拍攝或從相簿選取。</p></section><section class="glass"><div class="row between"><span class="heading">${icon('alert')} 日本官方警告</span><a class="btn" href="https://www.jma.go.jp/bosai/" target="_blank" rel="noopener">日本氣象廳</a></div><p class="notice">此版未接入官方即時警告推播；不會將一般預報誤作官方警報。</p></section>`;}function tripPage(){const d=data.days[day];return `<div class="tab-title" function receiptPage(){return `<div class="tab-title">Tax-Free 收據夾</div><div class="glass"><div class="row between"><div><div class="muted">已儲存收據</div><div style="font-size:31px;font-weight:800" id="receiptCount">--</div></div>${icon('receipt','big')}</div><div class="muted" id="receiptSync">${cloudMode()?'雲端模式：載入中':'本機模式：照片僅儲存在此瀏覽器'}</div></div><div class="glass"><div class="actions">${button(icon('camera')+' 直接拍照','capture','primary')}${button('從相簿選擇','gallery')}</div><p class="notice">拍攝後可直接儲存，商店名稱與備註均可選填。照片儲存在這部裝置的瀏覽器內。</p></div><div class="heading" style="margin:14px 4px">我的收據</div><div id="receiptList" class="glass"><div class="empty">載入中…</div></div>`;}function settingsPage(){return `<div class="tab-title">設定與備份</div><section class="glass"><h3>行程資料</h3><p class="muted">行程只存在本機。請定期匯出 JSON 備份；清除瀏覽器資料可能令行程消失。</p><div class="actions">${button('匯出行程 JSON','export','primary')}${button('匯入 JSON','import')}${button('還原示範行程','reset')}</div></section><section class="glass"><h3>收據儲存模式</h3><p class="muted">${cloudMode()?'已啟用雲端 API：'+location.origin:'照片保存在這部裝置，無須登入。清除網站資料會刪除本機照片。'}</p><p class="notice">重要收據請另外保留原相片。</p></section><section class="glass"><h3>定位與外部服務</h3><p class="muted">允許定位後，下次開啟會自動取得位置。權限是否保留由 iOS／瀏覽器決定；網站關閉時不會持續定位。</p><div class="actions">${button("啟用／更新定位","relocate")}</div><p class="muted">地圖：Google 預覽 · 附近資料：Overpass（備用 Google Maps 搜尋）· 天氣：Open-Meteo · 導航：Google Maps。</p><p class="notice">定位需要 HTTPS 和使用者授權；第三方服務須有網絡。地圖服務有公平使用及速率限制。</p></section>`;}function cloudMode(){return location.protocol==='https:'&&location.pathname.startsWith('/app/')&&window.TRAVEL_POCKET_CLOUD===true;}
function openModal(html){document.body.classList.add('modal-open');$('overlay').innerHTML=`<div class="modal-back"><div class="modal"><div class="row between"><b>Travel Pocket</b><button class="btn" data-action="close">關閉 ✕</button></div><hr style="border:0;border-top:1px solid #c5dbed;margin:12px 0">${html}</div></div>`;}function closeModal(){$('overlay').innerHTML='';document.body.classList.remove('modal-open');}function stopForm(i=null){const s=i===null?{time:'12:00',name:'',note:'',url:''}:data.days[day].stops[i];editingStop=i;openModal(`<h2>${i===null?'新增行程':'編輯行程'}</h2><form id="stopForm" class="form"><div class="cols"><div><label>時間</label><input type="time" name="time" required value="${escapeHtml(s.time)}"></div><div><label>地點名稱</label><input name="name" required value="${escapeHtml(s.name)}"></div></div><label>備註</label><textarea name="note">${escapeHtml(s.note)}</textarea><label>專屬連結（Tabelog／預約／官方網站）</label><input type="url" name="url" value="${escapeHtml(s.url||'')}" placeholder="https://..."><div class="actions"><button class="btn primary" type="submit">儲存</button></div></form>`);}function receiptForm(blob,filename){if(!blob)return;window.pendingReceipt=blob;openModal(`<h2>新增收據</h2><div class="muted">${escapeHtml(filename)}</div><img class="preview" id="receiptPreview" alt="收據照片預覽"><form id="receiptForm" class="form"><label>商店名稱（選填）</label><input name="shop" placeholder="例如：Don Quijote"><label>備註（選填）</label><input name="note" placeholder="例如：免稅購物"><div class="actions"><button type="submit" class="btn primary">${icon('cloud')} 儲存收據</button></div></form>`);const u=URL.createObjectURL(blob);$('receiptPreview').src=u;$('receiptPreview').onload=()=>URL.revokeObjectURL(u);}async function loadReceipts(){if(page!=='receipts')return;try{receiptCache=cloudMode()?await cloudList():await localReceipt('getAll');receiptCache.sort((a,b)=>String(b.date).localeCompare(String(a.date)));$('receiptCount').textContent=receiptCache.length;$('receiptSync').textContent=cloudMode()?'已從 Cloudflare R2 讀取':'本機儲存 · 尚未同步雲端';$('receiptList').innerHTML=receiptCache.length?receiptCache.map((r,i)=>`<button class="place" data-action="viewReceipt:${i}"><div class="row"><div class="receipt-thumb">${icon('receipt','big')}</div><div class="grow"><b>${escapeHtml(r.shop||'未命名收據')}</b><small>${escapeHtml(new Date(r.date).toLocaleString('zh-HK'))}</small><small>${escapeHtml(r.note||'')}</small></div>${icon('pin')}</div></button>`).join(''):'<div class="empty">未有收據。按「直接拍照」開始儲存。</div>';}catch(e){$('receiptList').innerHTML='<p class="error">讀取收據失敗：'+escapeHtml(e.message)+'</p>';$('receiptSync').textContent='同步失敗';}}async function cloudList(){const r=await fetch('/api/receipts',{credentials:'same-origin'});if(!r.ok)throw Error('雲端 API '+r.status);return (await r.json()).items;}async function saveReceipt(blob,shop,note){const id=crypto.randomUUID(),date=new Date().toISOString();if(cloudMode()){const f=new FormData();f.append('image',blob,'receipt.jpg');f.append('shop',shop);f.append('note',note);const r=await fetch('/api/receipts',{method:'POST',body:f,credentials:'same-origin'});if(!r.ok)throw Error('雲端上傳失敗 '+r.status);}else await localReceipt('put',{id,date,shop,note,blob});}async function viewReceipt(i){const r=receiptCache[i];if(!r)return;let src;if(cloudMode())src='/api/receipts/'+encodeURIComponent(r.id)+'/image';else src=URL.createObjectURL(r.blob);openModal(`<h2>${escapeHtml(r.shop||'未命名收據')}</h2><p class="muted">${escapeHtml(new Date(r.date).toLocaleString('zh-HK'))}</p><img class="preview" src="${escapeHtml(src)}" alt="收據照片"><p class="muted">${escapeHtml(r.note||'')}</p><div class="actions">${button(icon('trash')+' 刪除','deleteReceipt:'+i,'danger')}</div>`);if(!cloudMode())$('overlay').querySelector('img').onload=()=>URL.revokeObjectURL(src);}async function deleteReceipt(i){const r=receiptCache[i];if(!r||!confirm('確定刪除此收據？'))return;try{if(cloudMode()){const res=await fetch('/api/receipts/'+encodeURIComponent(r.id),{method:'DELETE'});if(!res.ok)throw Er function haversine(a,b,c,d){const R=6371000,toRad=x=>x*Math.PI/180,dl=toRad(c-a),dn=toRad(d-b);const x=Math.sin(dl/2)**2+Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(dn/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}function distText(n){return Math.round(n).toLocaleString('en-US')+' m';}let locationBusy=false,weatherBusy=false;

  navigator.geolocation.getCurrentPosition(p=>{
    locationBusy=false;
    const nextLoc={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:Number.isFinite(p.coords.accuracy)?p.coords.accuracy:null};
    if(!Number.isFinite(nextLoc.lat)||!Number.isFinite(nextLoc.lng))return toast('取得無效座標，請重新定位');
    loc=nextLoc;lastLocationAt=Date.now();rememberLocation(true);
    const googleLink=$('googleNearbyLink');if(googleLink)googleLink.href=nearbyGoogleUrl();
    if(page==='nearby')render();
    if(page==='home')render();
    fetchWeather();
  },err=>{
    locationBusy=false;
    if(err.code===1)rememberLocation(false);
    const message=err.code===1?'位置存取被拒絕，請檢查 Chrome 權限':err.code===2?'暫時無法取得 GPS 位置':'定位逾時，請重試';
    const st=$('nearStatus');if(st)st.textContent=message;
    if(page==='home'){weatherError=message;render();}
    toast(message);
  },{enableHighAccuracy:true,timeout:15000,maximumAge:30000});
}
async function fetchWeather(){
  if(!loc||weatherBusy)return;
  weatherBusy=true;weatherError='';
  const lat=loc.lat,lng=loc.lng;
  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),12000);
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lng)}&current=temperature_2m,wind_speed_10m,precipitation&hourly=precipitation_probability&forecast_days=1&timezone=auto`;
    const r=await fetch(u,{signal:ctrl.signal,cache:'no-store'});
    if(!r.ok)throw Error('HTTP '+r.status);
    const j=await r.json();
    if(!j.current||!Number.isFinite(j.current.temperature_2m))throw Error('天氣資料不完整');
    const chances=j.hourly?.precipitation_probability||[];
    const maxChance=chances.length?Math.max(...chances.slice(0,6).filter(Number.isFinite)):null;
    weather={current:j.current,rain:j.current.precipitation>0||(maxChance!==null&&maxChance>=40),rainChance:maxChance};
    weatherError='';
  }catch(e){weatherError='天氣暫時無法載入 · '+(e.name==='AbortError'?'連線逾時':e.message);console.warn('Travel Pocket weather:',e);}
  finally{clearTimeout(timer);weatherBusy=false;if(page==='home')render();}
}
let nearbyRequest=0,nearbyAbortController=null;
function placeAddress(t){
  if(t['addr:full'])return t['addr:full'];
  return [...new Set(['prefecture','province','city','district','suburb','quarter','neighbourhood','place','street','housenumber','housename','unit'].map(k=>t['addr:'+k]).filter(Boolean))].join(' ')||'地址未提供 · 點擊可按店舖座標導航';
}
async function queryNearby(){
  if(!loc||page!=='nearby')return;
  const requestId=++nearbyRequest;
  if(nearbyAbortController)nearbyAbortController.abort();
  nearbyAbortController=new AbortController();
  const signal=nearbyAbortController.signal;
  const status=$('nearStatus'),list=$('nearList');
  if(status)status.textContent='GPS 已定位 · 正在查詢附近商店…';
  if(list)list.innerHTML='<div class="empty">正在連接 OpenStreetMap 店舖資料服務…<div class="notice" style="margin-top:8px">如果搜尋較慢，可使用上方的 Google Maps 搜尋按鈕。</div></div>';
  const selected=categories.find(x=>x[0]===category),[tag,value]=selected[2].split('=');
  // Include points, polygons and relations; do not return geometry-heavy full ways.
  const q=`[out:json][timeout:16];(node["${tag}"="${value}"](around:${radius},${loc.lat},${loc.lng});way["${tag}"="${value}"](around:${radius},${loc.lat},${loc.lng});relation["${tag}"="${value}"](around:${radius},${loc.lat},${loc.lng}););out center;`;
  // The current, explicitly documented endpoint for the former Kumi Systems instance.
  const servers=[
    {name:'Private.coffee',url:'https://overpass.private.coffee/api/interpreter',method:'GET'},
    {name:'FOSSGIS',url:'https://overpass-api.de/api/interpreter',method:'POST'}
  ];
  let responseJson=null,lastError=null;
  for(let i=0;i<servers.length;i++){
    if(requestId!==nearbyRequest||page!=='nearby'||signal.aborted)return;
    const server=servers[i];
    if(status)status.textContent='GPS 已定位 · '+(i===0?'搜尋附近地點…':'第一個服務未回應，嘗試備用來源…');
    const timerCtrl=new AbortController();
    const onAbort=()=>timerCtrl.abort();
    signal.addEventListener('abort',onAbort,{once:true});
    const timer=setTimeout(()=>timerCtrl.abort(),i===0?9000:10000);
    try{
      const opts={method:server.method,signal:timerCtrl.signal,cache:'no-store',referrerPolicy:'strict-origin-when-cross-origin'};
      const endpoint=server.method==='GET'?server.url+'?data='+encodeURIComponent(q):server.url;
      if(server.method==='POST')opts.body=new URLSearchParams({data:q});
      const r=await fetch(endpoint,opts);
      if(!r.ok)throw Error(server.name+'：HTTP '+r.status);
      const body=await r.json();
      if(body.remark)throw Error(server.name+'：搜尋未完成，請重試');
      if(!Array.isArray(body.elements))throw Error(server.name+'：資料格式錯誤');
      responseJson=body;break;
    }catch(e){
      if(signal.aborted||requestId!==nearbyRequest)return;
      lastError=e;
      console.warn('Travel Pocket POI',server.name,e);
    }finally{
      clearTimeout(timer);
      signal.removeEventListener('abort',onAbort);
    }
  }
  if(requestId!==nearbyRequest||page!=='nearby'||signal.aborted)return;
  if(!responseJson){
    nearby=[];
    if(status)status.textContent='GPS 已定位 · 店舖資料服務暫時無法連線';
    if(list)list.innerHTML='<div class="empty">OpenStreetMap 店舖資料目前未能載入。<div class="actions" style="justify-content:center">'+button('重試搜尋','retryNearby')+button('在 Google Maps 尋找'+selected[1],'openGoogleNearby','primary')+'</div><div class="notice">'+escapeHtml(lastError?.name==='AbortError'?'服務連線逾時':lastError?.message||'網絡連線問題')+'</div></div>';
    return;
  }
  const seen=new Set();
  nearby=responseJson.elements.map(e=>{
    const lat=e.lat??e.center?.lat,lng=e.lon??e.center?.lon;
    if(!Number.isFinite(lat)||!Number.isFinite(lng))return null;
    const t=e.tags||{};
    const address=placeAddress(t);
    return {id:e.type+e.id,lat,lng,name:t['name:zh']||t['name:en']||t.name||t.brand||selected[1],address,distance:haversine(loc.lat,loc.lng,lat,lng)};
  }).filter(Boolean).filter(p=>p.distance<=radius).filter(p=>{
    const k=p.lat.toFixed(5)+','+p.lng.toFixed(5);
    if(seen.has(k))return false;seen.add(k);return true;
  }).sort((a,b)=>a.distance-b.distance).slice(0,80);
  if(status)status.textContent='GPS 已定位 · 找到 '+nearby.length+' 個'+selected[1]+'地點';
  if(list)list.innerHTML=nearby.length?nearby.map((p,i)=>`<button class="place" data-action="navigate:${i}"><div class="row">${icon(category)}<div class="grow"><b>${escapeHtml(p.name)}</b><small>${escapeHtml(p.address)}</small><small class="distance">距離約 ${distText(p.distance)}（直線） · 點擊步行導航</small></div>${icon('nav')}</div></button>`).join(''):'<div class="empty">此搜尋範圍內沒有已登記的'+escapeHtml(selected[1])+'。<div class="actions" style="justify-content:center">'+button('在 Google Maps 搜尋','openGoogleNearby','primary')+'</div></div>';
}
function exportJSON(){const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='travel-pocket-itinerary.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);}function filePicker(accept,capture,cb){const inp=document.createElement('input');inp.type='file';inp.accept=accept;if(capture)inp.setAttribute('capture','environment');inp.style.display='none';document.body.append(inp);inp.addEventListener('change',()=>{const f=inp.files?.[0];if(f)cb(f);inp.remove();},{once:true});inp.click();setTimeout(()=>{if(!inp.files?.length)inp.remove();},120000);}async function prepareImage(file){if(file.size>20*1024*1024)throw Error('照片超過 20 MB');try{const bmp=await createImageBitmap(file);const max=1800,scale=Math.min(1,max/Math.max(bmp.width,bmp.height));const canvas=document.createElement('canvas');canvas.width=Math.round(bmp.width*scale);canvas.height=Math.round(bmp.height*scale);canvas.getContext('2d').drawImage(bmp,0,0,canvas.width,canvas.height);bmp.close();return await new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(Error('無法壓縮照片')),'image/jpeg',.82));}catch{return file;}}
$('headerSettings').onclick=()=>{page='settings';render();};document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const p=b.dataset.page;if(p){page=p;render();return;}if(b.dataset.day!==undefined){day=+b.dataset.day;render();return;}if(b.dataset.category){category=b.dataset.category;nearby=[];render();return;}if(b.dataset.radius){radius=+b.dataset.radius;nearby=[];render();return;}const a=b.dataset.action;if(!a)return;const [action,idx]=a.split(':');if(action==='close')closeModal();else if(action==='weather'){if(!loc)locate();else{weatherDetails=!weatherDetails;render();}}else if(action==='nearby'){page='nearby';render();if(!loc)locate();}else if(action==='relocate')locate();else if(action==='retryNearby')queryNearby();else if(action==='openGoogleNearby')window.open(nearbyGoogleUrl(),'_blank','noopener');else if(action==='navigate'){const p=nearby[+idx];if(p)window.open(maps(p.lat,p.lng),'_blank','noopener');}else if(action==='addStop')stopForm();else if(action==='editStop')stopForm(+idx);else if(action==='delStop'){if(confirm('刪除此行程？')){data.days[day].stops.splice(+idx,1);persist();render();}}else if(action==='upStop'||action==='downStop'){const s=data.days[day].stops,i=+idx,j=i+(action==='upStop'?-1:1);if(j>=0&&j<s.length){[s[i],s[j]]=[s[j],s[i]];persist();render();}}else if(action==='addDay'){data.days.push({date:new Date().toISOString().slice(0,10),name:'新行程',stops:[]});day=data.days.length-1;persist();render();}else if(action==='editDay'){const d=data.days[day];openModal(`<h2>編輯日期</h2><form id="dayForm" class="form"><label>日期</label><input name="date" type="date" required value="${escapeHtml(d.date)}"><label>行程名稱</label><input name="name" required value="${escapeHtml(d.name)}"><button class="btn primary" style="margin-top:12px">儲存</button></form>`);}else if(action==='capture'||action==='gallery'){filePicker('image/*',action==='capture',async f=>{try{const b=await prepareImage(f);receiptForm(b,f.name);}catch(err){toast(err.message);}});}else if(action==='viewReceipt')viewReceipt(+idx);else if(action==='deleteReceipt')deleteReceipt(+idx);else if(action==='export')exportJSON();else if(action==='import')filePicker('.json,application/json',false,async f=>{try{const d=JSON.parse(await f.text());if(!Array.isArray(d.days)||!Array.isArray(d.favs)||d.days.length>500)throw Error('格式不正確');if(!confirm('匯入會覆蓋目前的本機行程，確定？'))return;data=d;day=0;persist();render();toast('已匯入');}catch(err){toast('匯入失敗：'+err.message);}});else if(action==='reset'){if(confirm('確定還原示範行程？')){data=structuredClone(initial);day=0;persist();render();}}});document.addEventListener('submit',async e=>{if(e.target.id==='stopForm'){e.preventDefault();const f=new FormData(e.target);const s={id:editingStop===null?crypto.randomUUID():data.days[day].stops[editingStop].id,time:String(f.get('time')),name:String(f.get('name')).trim(),note:String(f.get('note')),url:String(f.get('url'))};if(!s.name)return;if(s.url&&!safeUrl(s.url)){toast('請輸入有效 http/https 網址');return;}if(editingStop===null)data.days[day].stops.push(s);else data.days[day].stops[editingStop]=s;persist();closeModal();render();}else if(e.target.id==='dayForm'){e.preventDefault();const f=new FormData(e.target);data.days[day].date=String(f.get('date'));data.days[day].name=String(f.get('name'));persist();closeModal();render();}else if(e.target.id==='receiptForm'){e.preventDefault();const submit=e.target.querySelector('button[type=submit]');submit.disabled=true;submit.textContent='正在儲存…';try{const f=new FormData(e.target);await saveReceipt(window.pendingReceipt,String(f.get('shop')).trim(),String(f.get('note')).trim());window.pendingReceipt=null;closeModal();page='receipts';render();toast('收據已儲存');}catch(err){toast(err.message);submit.disabled=false;submit.textContent='重試儲存';}}});render();
let lastLocationAt=0,autoLocationPending=false;
function rememberLocation(value){try{localStorage.setItem('tp-auto-location',value?'1':'0');}catch{}}
function locationOptIn(){try{return localStorage.getItem('tp-auto-location')==='1';}catch{return false;}}
async function resumeLocation(){
  if(document.hidden||locationBusy||autoLocationPending||Date.now()-lastLocationAt<60000)return;
  autoLocationPending=true;
  try{
    let state='unknown';
    if(navigator.permissions?.query){try{state=(await navigator.permissions.query({name:'geolocation'})).state;}catch{}}
    if(state==='denied'){rememberLocation(false);return;}
    if(state==='granted'||locationOptIn())locate();
  }finally{autoLocationPending=false;}
}
function syncViewport(){const v=window.visualViewport;document.documentElement.style.setProperty('--visual-height',(v?.height||window.innerHeight)+'px');document.documentElement.style.setProperty('--visual-top',(v?.offsetTop||0)+'px');}
window.visualViewport?.addEventListener('resize',syncViewport);
window.visualViewport?.addEventListener('scroll',syncViewport);
window.addEventListener('pageshow',resumeLocation);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)resumeLocation();});
syncViewport();resumeLocation();
