    nearby=[];drawMarkers();
    if(status)status.textContent='GPS 已定位 · 店舖資料服務暫時無法連線';
    if(list)list.innerHTML='<div class="empty">OpenStreetMap 店舖資料目前未能載入。<div class="actions" style="justify-content:center">'+button('重試搜尋','retryNearby')+button('在 Google Maps 尋找'+selected[1],'openGoogleNearby','primary')+'</div><div class="notice">'+escapeHtml(lastError?.name==='AbortError'?'服務連線逾時':lastError?.message||'網絡連線問題')+'</div></div>';
    return;
  }
  const seen=new Set();
  nearby=responseJson.elements.map(e=>{
    const lat=e.lat??e.center?.lat,lng=e.lon??e.center?.lon;
    if(!Number.isFinite(lat)||!Number.isFinite(lng))return null;
    const t=e.tags||{};
    const address=t['addr:full']||[t['addr:prefecture'],t['addr:city'],t['addr:street'],t['addr:housenumber']].filter(Boolean).join(' ')||'地址未提供 · 可按座標導航';
    return {id:e.type+e.id,lat,lng,name:t['name:zh']||t['name:en']||t.name||selected[1],address,distance:haversine(loc.lat,loc.lng,lat,lng)};
  }).filter(Boolean).filter(p=>p.distance<=radius).filter(p=>{
    const k=p.lat.toFixed(5)+','+p.lng.toFixed(5);
    if(seen.has(k))return false;seen.add(k);return true;
  }).sort((a,b)=>a.distance-b.distance).slice(0,80);
  if(status)status.textContent='GPS 已定位 · 找到 '+nearby.length+' 個'+selected[1]+'地點';
  drawMarkers();
  if(list)list.innerHTML=nearby.length?nearby.map((p,i)=>`<button class="place" data-action="navigate:${i}"><div class="row">${icon(category)}<div class="grow"><b>${escapeHtml(p.name)}</b><small>${escapeHtml(p.address)}</small><small class="distance">${distText(p.distance)} · 點擊直接步行導航</small></div>${icon('nav')}</div></button>`).join(''):'<div class="empty">此搜尋範圍內沒有已登記的'+escapeHtml(selected[1])+'。<div class="actions" style="justify-content:center">'+button('在 Google Maps 搜尋','openGoogleNearby','primary')+'</div></div>';
}
function exportJSON(){const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='travel-pocket-itinerary.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);}function filePicker(accept,capture,cb){const inp=document.createElement('input');inp.type='file';inp.accept=accept;if(capture)inp.setAttribute('capture','environment');inp.style.display='none';document.body.append(inp);inp.addEventListener('change',()=>{const f=inp.files?.[0];if(f)cb(f);inp.remove();},{once:true});inp.click();setTimeout(()=>{if(!inp.files?.length)inp.remove();},120000);}async function prepareImage(file){if(file.size>20*1024*1024)throw Error('照片超過 20 MB');try{const bmp=await createImageBitmap(file);const max=1800,scale=Math.min(1,max/Math.max(bmp.width,bmp.height));const canvas=document.createElement('canvas');canvas.width=Math.round(bmp.width*scale);canvas.height=Math.round(bmp.height*scale);canvas.getContext('2d').drawImage(bmp,0,0,canvas.width,canvas.height);bmp.close();return await new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(Error('無法壓縮照片')),'image/jpeg',.82));}catch{return file;}}
$('headerSettings').onclick=()=>{page='settings';render();};document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const p=b.dataset.page;if(p){page=p;render();return;}if(b.dataset.mapProvider){mapProvider=b.dataset.mapProvider;nearby=[];if(nearbyAbortController)nearbyAbortController.abort();render();return;}if(b.dataset.day!==undefined){day=+b.dataset.day;render();return;}if(b.dataset.category){category=b.dataset.category;nearby=[];render();return;}if(b.dataset.radius){radius=+b.dataset.radius;nearby=[];render();return;}const a=b.dataset.action;if(!a)return;const [action,idx]=a.split(':');if(action==='close')closeModal();else if(action==='weather'){if(!loc)locate();else{weatherDetails=!weatherDetails;render();}}else if(action==='nearby'){page='nearby';render();if(!loc)locate();}else if(action==='relocate')locate();else if(action==='retryNearby')queryNearby();else if(action==='openGoogleNearby')window.open(nearbyGoogleUrl(),'_blank','noopener');else if(action==='navigate'){const p=nearby[+idx];if(p)window.open(maps(p.lat,p.lng),'_blank','noopener');}else if(action==='addStop')stopForm();else if(action==='editStop')stopForm(+idx);else if(action==='delStop'){if(confirm('刪除此行程？')){data.days[day].stops.splice(+idx,1);persist();render();}}else if(action==='upStop'||action==='downStop'){const s=data.days[day].stops,i=+idx,j=i+(action==='upStop'?-1:1);if(j>=0&&j<s.length){[s[i],s[j]]=[s[j],s[i]];persist();render();}}else if(action==='addDay'){data.days.push({date:new Date().toISOString().slice(0,10),name:'新行程',stops:[]});day=data.days.length-1;persist();render();}else if(action==='editDay'){const d=data.days[day];openModal(`<h2>編輯日期</h2><form id="dayForm" class="form"><label>日期</label><input name="date" type="date" required value="${escapeHtml(d.date)}"><label>行程名稱</label><input name="name" required value="${escapeHtml(d.name)}"><button class="btn primary" style="margin-top:12px">儲存</button></form>`);}else if(action==='capture'||action==='gallery'){filePicker('image/*',action==='capture',async f=>{try{const b=await prepareImage(f);receiptForm(b,f.name);}catch(err){toast(err.message);}});}else if(action==='viewReceipt')viewReceipt(+idx);else if(action==='deleteReceipt')deleteReceipt(+idx);else if(action==='export')exportJSON();else if(action==='import')filePicker('.json,application/json',false,async f=>{try{const d=JSON.parse(await f.text());if(!Array.isArray(d.days)||!Array.isArray(d.favs)||d.days.length>500)throw Error('格式不正確');if(!confirm('匯入會覆蓋目前的本機行程，確定？'))return;data=d;day=0;persist();render();toast('已匯入');}catch(err){toast('匯入失敗：'+err.message);}});else if(action==='reset'){if(confirm('確定還原示範行程？')){data=structuredClone(initial);day=0;persist();render();}}});document.addEventListener('submit',async e=>{if(e.target.id==='stopForm'){e.preventDefault();const f=new FormData(e.target);const s={id:editingStop===null?crypto.randomUUID():data.days[day].stops[editingStop].id,time:String(f.get('time')),name:String(f.get('name')).trim(),note:String(f.get('note')),url:String(f.get('url'))};if(!s.name)return;if(s.url&&!safeUrl(s.url)){toast('請輸入有效 http/https 網址');return;}if(editingStop===null)data.days[day].stops.push(s);else data.days[day].stops[editingStop]=s;persist();closeModal();render();}else if(e.target.id==='dayForm'){e.preventDefault();const f=new FormData(e.target);data.days[day].date=String(f.get('date'));data.days[day].name=String(f.get('name'));persist();closeModal();render();}else if(e.target.id==='receiptForm'){e.preventDefault();const submit=e.target.querySelector('button[type=submit]');submit.disabled=true;submit.textContent='正在儲存…';try{const f=new FormData(e.target);await saveReceipt(window.pendingReceipt,String(f.get('shop')).trim(),String(f.get('note')).trim());window.pendingReceipt=null;closeModal();page='receipts';render();toast('收據已儲存');}catch(err){toast(err.message);submit.disabled=false;submit.textContent='重試儲存';}}});render();
if(navigator.permissions?.query){navigator.permissions.query({name:'geolocation'}).then(result=>{if(result.state==='granted'&&!loc)locate();}).catch(()=>{});}
</script></body></html>
