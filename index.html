}

  if(oldNode.nodeType!==1)return;
  if(oldNode.tagName==='IFRAME'&&(oldNode.classList.contains('home-map-iframe')||oldNode.id==='googleMapFrame')){
    tpMapSyncIframe(oldNode,newNode,view);return;
  }
  for(const a of [...oldNode.attributes])if(!newNode.hasAttribute(a.name))oldNode.removeAttribute(a.name);
  for(const a of [...newNode.attributes])if(oldNode.getAttribute(a.name)!==a.value)oldNode.setAttribute(a.name,a.value);
  const next=[...newNode.childNodes];
  for(let i=0;i<next.length;i++){
    if(i>=oldNode.childNodes.length)oldNode.appendChild(next[i].cloneNode(true));
    else tpMapMorph(oldNode.childNodes[i],next[i],view);
  }
  while(oldNode.childNodes.length>next.length)oldNode.lastChild.remove();

/* Keep all saved itinerary stops in chronological order; equal times retain their order. */
function tpStopTimeMinutes(stop){
 const match=/^(\d{1,2}):([0-5]\d)(?::[0-5]\d)?$/.exec(String(stop?.time||'').trim());
 if(!match)return Number.POSITIVE_INFINITY;
 const hours=Number(match[1]);
 return hours<24?hours*60+Number(match[2]):Number.POSITIVE_INFINITY;
}
function tpSortStopsByTime(){
 let changed=false;
 for(const d of data.days){
  if(!Array.isArray(d.stops)||d.stops.length<2)continue;
  const before=d.stops.slice();
  d.stops.sort((a,b)=>{
   const aTime=tpStopTimeMinutes(a),bTime=tpStopTimeMinutes(b);
   return aTime===bTime?0:aTime-bTime;
  });
  if(!changed&&d.stops.some((stop,i)=>stop!==before[i]))changed=true;
 }
 return changed;
}
/* Group adjacent chronological stops; retain indices for independent editing. */
function tpGroupStopsByTime(items){
 const groups=[];
 (items||[]).forEach((stop,index)=>{
  const minutes=tpStopTimeMinutes(stop);
  const key=Number.isFinite(minutes)?'time:'+minutes:'raw:'+String(stop?.time||'').trim();
  const prev=groups[groups.length-1];
  const entry={stop,index};
  if(prev&&prev.key===key)prev.entries.push(entry);
  else groups.push({key,time:stop?.time||'--:--',entries:[entry]});
 });
 return groups;
}

function jmaOfficeFor(class20,areas){
 let code=String(class20);
 for(let i=0;i<5;i++){
  if(areas.offices?.[code])return code;
  const entry=areas.class20s?.[code]||areas.class15s?.[code]||areas.class10s?.[code];
  if(!entry?.parent)return '';

function jmaNearestArea(position,areas,xy){
 const rad=Math.PI/180,lat=position.lat*rad,lng=position.lng*rad;
 let best=null;
 for(const [code,coordinates] of Object.entries(xy.class20s||{})){
  if(!areas.class20s?.[code]||!Array.isArray(coordinates)||coordinates.length<2)continue;
  const a=Number(coordinates[0])*rad,b=Number(coordinates[1])*rad;
  if(!Number.isFinite(a)||!Number.isFinite(b))continue;
  const dLat=a-lat,dLng=b-lng;
  const h=Math.sin(dLat/2)**2+Math.cos(lat)*Math.cos(a)*Math.sin(dLng/2)**2;
  const distance=6371*2*Math.asin(Math.min(1,Math.sqrt(h)));
  if(!best||distance<best.km)best={code,km:distance,name:areas.class20s[code].name};
 }
 if(!best||best.km>75)return null;
 const office=jmaOfficeFor(best.code,areas);
 return office?{...best,office}:null;
}
function jmaActiveWarnings(reports,areaCode){
 if(!Array.isArray(reports)||!reports.length)throw Error('警報資料格式不符');
 let incomplete=false,recent=0;
 const active=new Map();
 for(const report of reports){
  if(!report||!report.warning||!Array.isArray(report.warning.class20Items)){incomplete=true;continue;}
  const stamp=Date.parse(report.reportDatetime||'');
  if(Number.isFinite(stamp))recent=Math.max(recent,stamp);
  const item=report.warning.class20Items.find(row=>String(row.areaCode)===areaCode);
  if(!item||!Array.isArray(item.kinds)||!item.kinds.length){incomplete=true;continue;}
  for(const kind of item.kinds){
   const status=kind?.status,code=String(kind?.code||'');
   if(status==='発表'||status==='継続'){
    if(!code){incomplete=true;continue;}
    const known=jmaWarningNames[code];
    active.set(code,{label:known?.[0]||'未識別警報（'+code+'）',priority:known?.[1]||1});
    if(!known)incomplete=true;
   }else if(status!=='解除'&&status!=='発表警報・注意報はなし'){
    incomplete=true;
   }
  }
 }
 if(!recent||recent>Date.now()+3600000||Date.now()-recent>60*86400000)incomplete=true;
 return {active:[...active.values()].sort((a,b)=>b.priority-a.priority),incomplete};
}
function localQuakeSummary(rows,point){
 if(!Array.isArray(rows))throw Error('地震資料格式不符');
 const seen=new Set(),now=Date.now(),events=[];
 for(const row of rows){
  if(!row||!row.eid||seen.has(row.eid))continue;
  const timestamp=Date.parse(row.at||'');
  if(!Number.isFinite(timestamp)||timestamp>now+300000||now-timestamp>24*3600000)continue;
  const match=String(row.cod||'').match(/^([+-]\d+(?:\.\d+)?)([+-]\d+(?:\.\d+)?)/);
  if(!match)continue;
  const toDegrees=value=>{const v=Math.abs(Number(value)),deg=Math.floor(v/100);return Math.sign(Number(value))*(deg+(v-deg*100)/60);};
  const lat=toDegrees(match[1]),lng=toDegrees(match[2]);
  if(!Number.isFinite(lat)||!Number.isFinite(lng))continue;
  const rad=Math.PI/180,a=point.lat*rad,b=lat*rad;
  const h=Math.sin((b-a)/2)**2+Math.cos(a)*Math.cos(b)*Math.sin((lng-point.lng)*rad/2)**2;
  const km=6371*2*Math.asin(Math.min(1,Math.sqrt(h)));
  if(km>150)continue;
  seen.add(row.eid);
  events.push({timestamp,region:String(row.anm||'震央附近'),maxi:String(row.maxi||'')});
 }
 events.sort((a,b)=>b.timestamp-a.timestamp);
 return events[0]||null;
}

function tpFlightStatusLabel(status,quality){
 const state=String(status||'').toLowerCase().replace(/[^a-z]/g,'');
 const names={arrived:'已抵達',departed:'已起飛',enroute:'飛行中',active:'飛行中',airborne:'飛行中',boarding:'登機中',checkin:'辦理登機',delayed:'延誤',cancelled:'已取消',canceled:'已取消',diverted:'已轉降',expected:'預計起飛',scheduled:'預定航班',unknown:'待確認'};
 return names[state]||(status?String(status):quality?.includes('Live')?'已更新':'預定航班');
}

function tpFlightLocalTime(value){
 const raw=String(value?.local||'');
 return raw.match(/(?:T| )(\d{2}:\d{2})/)?.[1]||'';
}

function tpFlightCheckIn(value){
 if(!value)return '待公布';
 const parts=String(value).toUpperCase().split(/[,\s;/]+/).map(s=>s.replace(/[^A-Z]/g,'')).filter(s=>/^[A-Z]{1,2}$/.test(s));
 return [...new Set(parts)].join('、')||'待公布';
}

function tpFlightCard(){
 const dir=tpFlightDirection,cfg=tpFlightConfig(dir);
 const cache=tpFlightReadCache()[dir];
 const same=cache?.query===cfg.code+'|'+cfg.date;
 const f=same?cache.flight:null;
 const dep=f?.departure||{},arr=f?.arrival||{};
 const changed=cfg.code!==cfg.original.code||cfg.date.replace(/-/g,'/')!==cfg.original.date;
 const from=dep.airport?.iata||(changed?'--':cfg.original.from);
 const to=arr.airport?.iata||(changed?'--':cfg.original.to);
 const depTime=tpFlightLocalTime(dep.revisedTime)||tpFlightLocalTime(dep.scheduledTime)||(changed?'--:--':cfg.original.dep);
 const arrTime=tpFlightLocalTime(arr.revisedTime)||tpFlightLocalTime(arr.scheduledTime)||(changed?'--:--':cfg.original.arr);
 const gate=dir==='out'?dep.gate:arr.gate;
 const term=dir==='out'?dep.terminal:arr.terminal;
 const status=f?tpFlightStatusLabel(f.status,dep.quality||arr.quality):tpFlightPending[dir]?'查詢中':tpFlightProblem[dir]?'連線失敗':same?'暫無資料':tpFlightConfigured()?'待更新':'未連接';
 const checkIn=tpFlightCheckIn(dep.checkInDesk);
 const fields=[['ticket','預訂參考編號','EP2YRI'],['terminal',dir==='out'?'出發航廈':'抵達航廈',term||'待公布'],['gate',dir==='out'?'登機閘口':'抵達閘口',gate||'待公布'],dir==='out'?['checkin','登記行段',checkIn]:['luggage','行李轉盤',arr.baggageBelt||'待公布']];

 const operator=f&&liveNumber&&liveNumber!==cfg.code?'<div class="tp-flight-source">實際執飛：'+escapeHtml(f.airline?.name||'')+' '+escapeHtml(f.number||'')+'</div>':'';

function tpFlightUpdateCard(){
 if(page!=='home')return;
 const card=$('screen')?.querySelector('.tp-flight');
 if(card)card.outerHTML=tpFlightCard();
}
async function tpFlightMaybeRefresh(force=false,dir=tpFlightDirection){
 const cfg=tpFlightConfig(dir);
 if(!tpFlightConfigured()||tpFlightPending[dir]||!/^([A-Z0-9]{2,4})\d{1,5}[A-Z]?$/.test(cfg.code)||!/^\d{4}-\d\d-\d\d$/.test(cfg.date))return;
 const key=cfg.code+'|'+cfg.date,cache=tpFlightReadCache()[dir];
 const now=Date.now();
 const days=(Date.parse(cfg.date+'T00:00:00Z')-now)/86400000;
 if(days>366||days < -366){tpFlightProblem[dir]='航班日期超出 API 的前後 365 天查詢範圍';return;}
 const ttl=days>7?24*3600000:days>1?6*3600000:days>=-1?30*60000:24*3600000;
 if(!force&&cache?.query===key&&now-cache.fetchedAt<ttl)return;
 if(!force&&tpFlightRetryAt[dir]>now)return;
 if(force&&now-tpFlightManualAt[dir]<30000){toast('請至少相隔 30 秒再重新查詢');return;}
 if(force)tpFlightManualAt[dir]=now;
 tpFlightPending[dir]=true;tpFlightProblem[dir]='';
 try{
  const url='https://aerodatabox.p.rapidapi.com/flights/number/'+encodeURIComponent(cfg.code)+'/'+cfg.date+'?withAircraftImage=false&withLocation=false';
  const headers={'Accept':'application/json','X-RapidAPI-Host':'aerodatabox.p.rapidapi.com','X-RapidAPI-Key':tpFlightApiKey()};
  const response=await fetch(url,{method:'GET',headers,cache:'no-store'});
  const body=await response.text();let payload;
  try{payload=JSON.parse(body);}catch{throw Error('API 回傳非 JSON 資料（HTTP '+response.status+'）');}
  if(!response.ok)throw Error('HTTP '+response.status+'：'+String(payload.message||payload.error||'請檢查 API 額度與設定').slice(0,180));
  const list=Array.isArray(payload)?payload:Array.isArray(payload.response)?payload.response:Array.isArray(payload.flights)?payload.flights:[payload];
  const matches=list.filter(x=>x&&typeof x==='object'&&x.departure&&x.arrival);
  const chosen=matches.find(x=>x.departure?.airport?.iata===cfg.original.from&&x.arrival?.airport?.iata===cfg.original.to)||matches[0]||null;
  const full=tpFlightReadCache();full[dir]={query:key,flight:chosen,fetchedAt:Date.now()};
  localStorage.setItem('tp-flight-cache-v1',JSON.stringify(full));
  tpFlightRetryAt[dir]=0;
  if(force)toast(chosen?'航班查詢成功':'查詢成功，但暫無此航班資料');
 }catch(err){
  tpFlightProblem[dir]=String(err?.message||err).includes('Failed to fetch')?'無法連接 API，可能是網絡或 CORS 限制':String(err?.message||err);
  tpFlightRetryAt[dir]=Date.now()+15*60000;
  if(force)toast('航班 API：'+tpFlightProblem[dir]);
 }finally{
  tpFlightPending[dir]=false;
  if(page==='home')tpFlightUpdateCard();
  if(document.getElementById('tpFlightSettingsForm'))openModal(settingsPanel());
 }
}

const tpFx={source:'JPY',raw:'10000',rate:null,date:'',status:'loading',acc:null,op:null,waiting:false,finished:false,history:'',error:'',percentLabel:'',firstEntry:true,selectionMade:false};
const tpFxMoney=new Intl.NumberFormat('en-HK',{minimumFractionDigits:2,maximumFractionDigits:2}),tpFxNum=new Intl.NumberFormat('en-HK',{maximumFractionDigits:8});
function tpFxFormat(s){if(!s)return '';const neg=s.startsWith('-'),p=(neg?s.slice(1):s).split('.');return (neg?'-':'')+p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',')+(p.length>1?'.'+p.slice(1).join(''):'');}
function tpFxClean(s){s=String(s).replace(/[,\s¥]/g,'').replace(/[^0-9.\-]/g,'');const neg=s.startsWith('-'),p=s.replace(/-/g,'').split('.');return (neg?'-':'')+p[0].slice(0,13)+(p.length>1?'.'+p.slice(1).join('').slice(0,8):'');}
function tpFxReset(){Object.assign(tpFx,{acc:null,op:null,waiting:false,finished:false,history:'',error:'',percentLabel:''});}
function tpFxConvert(n,from){return tpFx.rate===null?null:(from==='JPY'?n*tpFx.rate:n/tpFx.rate);}
function tpFxRender(write=true){
 if(!$('fxv6'))return;
 const s=tpFx,other=s.source==='JPY'?'HKD':'JPY',inputs={JPY:$('fxv6-jpy'),HKD:$('fxv6-hkd')};
 if(write)inputs[s.source].value=tpFxFormat(s.raw);
 const valid=s.raw!==''&&s.raw!=='-'&&Number.isFinite(Number(s.raw)),converted=valid?tpFxConvert(Number(s.raw),s.source):null;
 inputs[other].value=converted===null?'—':tpFxMoney.format(converted);
 for(const cur of ['JPY','HKD']){const active=cur===s.source;inputs[cur].readOnly=!active;$('fxv6-'+cur.toLowerCase()+'box').classList.toggle('active',active&&s.selectionMade);$('fxv6-'+cur.toLowerCase()+'clear').hidden=!active||s.raw==='';}
 $('fxv6-arrow').textContent=s.source==='JPY'?'→':'←';
 $('fxv6-rate').textContent=s.rate===null?'匯率暫不可用':s.source==='JPY'?'¥100 ≈ HK$'+tpFxMoney.format(s.rate*100):'HK$1 ≈ ¥'+tpFxMoney.format(1/s.rate);
 $('fxv6-direction').textContent=s.source+' → '+other;
 $('fxv6-status').textContent=s.status==='live'?'參考匯率 · '+s.date:s.status==='cached'?'上次匯率 · '+s.date:s.status==='loading'?'正在取得參考匯率…':'匯率暫不可用 · 請連線重試';
 const signs={'+':'+','-':'−','*':'×','/':'÷'};
 $('fxv6-expr').textContent=s.error||s.history||(s.op?tpFxNum.format(s.acc)+' '+signs[s.op]+(s.waiting?'':' '+(s.percentLabel||tpFxFormat(s.raw))):(s.source==='JPY'?'日圓計算機':'港幣計算機'));
 $('fxv6').querySelectorAll('.fxv6-key.op').forEach(b=>b.classList.toggle('selected',b.dataset.fxKey===s.op&&s.waiting));
}
function tpFxSwitch(){
 tpFx.selectionMade=true;
 const n=tpFx.raw!==''&&tpFx.raw!=='-'?tpFxConvert(Number(tpFx.raw),tpFx.source):null;
 tpFx.raw=n!==null&&Number.isFinite(n)?String(Number(n.toFixed(2))):'';
 tpFx.source=tpFx.source==='JPY'?'HKD':'JPY';tpFxReset();tpFxRender();
}
function tpFxCalc(a,o,b){if(o==='/'&&b===0)return null;const n=o==='+'?a+b:o==='-'?a-b:o==='*'?a*b:a/b;return Number.isFinite(n)&&Math.abs(n)<1e14?Number(n.toPrecision(12)):null;}
function tpFxPress(k){
 if(k==='switch'){tpFxSwitch();return;}
 const s=tpFx;s.selectionMade=true;s.error='';
 if(k==='AC'){s.raw='0';tpFxReset();s.firstEntry=false;}
 else if(k==='back'){if(s.waiting){s.op=null;s.acc=null;s.waiting=false;}else{s.raw=s.raw.length>1?s.raw.slice(0,-1):'0';if(s.raw==='-')s.raw='0';s.finished=false;s.history='';s.percentLabel='';s.firstEntry=false;}}
 else if(/^\d$/.test(k)){if(s.firstEntry||s.waiting||s.finished){s.raw=k;s.waiting=false;s.finished=false;s.history='';}else if(s.raw.replace(/\D/g,'').length<13)s.raw=s.raw==='0'?k:s.raw+k;s.firstEntry=false;s.percentLabel='';}
 else if(k==='.'){if(s.firstEntry||s.waiting||s.finished){s.raw='0.';s.waiting=false;s.finished=false;s.history='';}else if(!s.raw.includes('.'))s.raw=(s.raw||'0')+'.';s.firstEntry=false;s.percentLabel='';}
 else if(k==='%'){if(!s.waiting&&!s.percentLabel&&s.raw!==''&&s.raw!=='-'&&Number.isFinite(Number(s.raw))){const value=Number(s.raw),percent=(s.op==='+'||s.op==='-')&&s.acc!==null?s.acc*value/100:value/100;s.percentLabel=tpFxFormat(s.raw)+'%';s.raw=String(Number(percent.toPrecision(12)));s.finished=false;s.history='';s.firstEntry=false;}}
 else if(['+','-','*','/'].includes(k)){if(s.raw===''||s.raw==='-')return;if(s.op&&!s.waiting){const v=tpFxCalc(s.acc,s.op,Number(s.raw));if(v===null){s.raw='';tpFxReset();s.error='無法完成計算';tpFxRender();return;}s.raw=String(v);s.acc=v;}else s.acc=Number(s.raw);s.op=k;s.waiting=true;s.finished=false;s.history='';s.percentLabel='';s.firstEntry=false;}
 else if(k==='='){if(!s.op||s.waiting)return;const a=s.acc,b=Number(s.raw),o=s.op,v=tpFxCalc(a,o,b);if(v===null){s.raw='';tpFxReset();s.error='無法除以 0 或計算錯誤';}else{s.history=tpFxNum.format(a)+' '+({'+':'+','-':'−','*':'×','/':'÷'}[o])+' '+(s.percentLabel||tpFxNum.format(b))+' =';s.percentLabel='';s.raw=String(v);s.op=null;s.acc=null;s.waiting=false;s.finished=true;}}
 tpFxRender();
}
function tpFxInit(){
 if(!$('fxv6'))return;
 for(const cur of ['JPY','HKD']){
  const id=cur.toLowerCase(),box=$('fxv6-'+id+'box'),input=$('fxv6-'+id),clear=$('fxv6-'+id+'clear');
  box.addEventListener('click',e=>{if(e.target.closest('.fxv6-clear'))return;if(tpFx.source!==cur){tpFxSwitch();input.focus();}else if(!tpFx.selectionMade){tpFx.selectionMade=true;tpFxRender(false);}});
  input.addEventListener('input',()=>{if(tpFx.source!==cur)return;tpFx.raw=tpFxClean(input.value);tpFxReset();tpFx.firstEntry=false;tpFxRender(false);});
  input.addEventListener('focus',()=>{if(tpFx.source!==cur)return;tpFx.selectionMade=true;if(tpFx.firstEntry){tpFx.raw='';tpFxReset();tpFx.firstEntry=false;tpFxRender();input.focus();}else tpFxRender(false);});
  input.addEventListener('blur',()=>{if(tpFx.source===cur)tpFxRender();});
  clear.addEventListener('click',e=>{e.stopPropagation();if(tpFx.source!==cur)return;tpFx.raw='';tpFxReset();tpFx.firstEntry=false;tpFxRender();input.focus();});
 }
 $('fxv6-toggle').addEventListener('click',()=>{const pad=$('fxv6-pad'),open=pad.hidden;pad.hidden=!open;$('fxv6-toggle').setAttribute('aria-expanded',String(open));$('fxv6-toggle').setAttribute('aria-label',open?'收起計算機':'展開計算機');});
 $('fxv6-pad').addEventListener('click',e=>{const b=e.target.closest('button[data-fx-key]');if(b)tpFxPress(b.dataset.fxKey);});
 tpFxRender();void tpFxRate();
}
async function tpFxRate(){
 const s=tpFx,key='travelPocketJpyHkdRateV1';
 try{const cache=JSON.parse(localStorage.getItem(key)||'null');if(cache&&Number.isFinite(cache.rate)&&cache.rate>0&&cache.date){s.rate=cache.rate;s.date=cache.date;s.status='cached';tpFxRender();}}catch{}
 const sources=[
  {url:'https://open.er-api.com/v6/latest/JPY',parse:j=>({rate:Number(j?.rates?.HKD),date:j?.time_last_update_utc?new Date(j.time_last_update_utc).toISOString().slice(0,10):new Date().toISOString().slice(0,10)})},
  {url:'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/jpy.json',parse:j=>({rate:Number(j?.jpy?.hkd),date:j?.date})},
  {url:'https://api.frankfurter.app/latest?from=JPY&to=HKD',parse:j=>({rate:Number(j?.rates?.HKD),date:j?.date})}
 ];
 for(const source of sources){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),5500);
  try{
   const response=await fetch(source.url,{signal:controller.signal,cache:'no-store'});
   if(!response.ok)throw Error('rate HTTP '+response.status);
   const result=source.parse(await response.json());
   if(!Number.isFinite(result.rate)||result.rate<=0||typeof result.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(result.date))throw Error('invalid rate');
   s.rate=result.rate;s.date=result.date;s.status='live';
   try{localStorage.setItem(key,JSON.stringify({rate:s.rate,date:s.date}));}catch{}
   tpFxRender();return;
  }catch(err){/* Try the next public reference-rate provider. */}
  finally{clearTimeout(timer);}
 }
 s.status=s.rate===null?'unavailable':'cached';tpFxRender();
}

function tpOtherCollapsedItems(){
 const cl=tpOtherChecklist();
 const category=cl.categories.find(c=>cl.tasks.some(t=>t.category===c&&!t.done));
 if(!category)return {category:'全部完成',items:[]};
 const tasks=cl.tasks.filter(t=>t.category===category);
 const pending=tasks.filter(t=>!t.done);
 if(pending.length>=2)return {category,items:pending.slice(0,2)};
 // Keep the last completed item before the remaining pending item visible.
 const index=tasks.indexOf(pending[0]);
 const previous=tasks.slice(0,index).filter(t=>t.done).pop();
 const next=tasks.slice(index+1).find(t=>t.done);
 const companion=previous||next;
 const items=companion?(previous?[companion,pending[0]]:[pending[0],companion]):[pending[0]];
 return {category,items};
}

function tpOtherReadPhoto(file){
 if(!file||!file.type.startsWith('image/')){toast('請選擇圖片');return;}
 if(file.size>20*1024*1024){toast('圖片需要小於 20 MB');return;}
 tpOtherImageProcessing=true;
 const done=blob=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('圖片讀取失敗'));reader.readAsDataURL(blob);});
 Promise.resolve().then(async()=>{
  let blob=file;
  try{
   const bmp=await createImageBitmap(file),ratio=Math.min(1,1200/Math.max(bmp.width,bmp.height));
   const canvas=document.createElement('canvas');
   canvas.width=Math.max(1,Math.round(bmp.width*ratio));canvas.height=Math.max(1,Math.round(bmp.height*ratio));
   canvas.getContext('2d').drawImage(bmp,0,0,canvas.width,canvas.height);bmp.close();
   blob=await new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(Error('圖片壓縮失敗')),'image/jpeg',.72));
  }catch{/* Preserve compatible image files when canvas is unavailable. */}
  const value=String(await done(blob));
  if(!tpOtherAllowedImage(value)||value.length>2000000)throw Error('圖片儲存容量不足，請換較小的圖片');
  tpOtherImageData=value;
  const hint=$('tpOtherImageHint');if(hint)hint.textContent='已選擇圖片';
 }).catch(err=>toast(err.message||'圖片讀取失敗')).finally(()=>{tpOtherImageProcessing=false;});
}

function tpOtherHandleClick(ev){
 const btn=ev.target.closest('[data-tp-other-action]');if(!btn||!btn.closest('.tp-other-root'))return;
 ev.preventDefault();ev.stopImmediatePropagation();
 const action=btn.dataset.tpOtherAction,cl=tpOtherChecklist(),id=btn.dataset.tpOtherId,name=btn.dataset.tpOtherCat;
 switch(action){
 case 'fold-ticket':tpOtherOpen=tpOtherOpen==='ticket'?null:'ticket';break;
 case 'fold-list':tpOtherOpen=tpOtherOpen==='list'?null:'list';break;
 case 'select-category':if(Date.now()<tpOtherBlockedClickUntil)return;tpOtherSelectedCategory=name;break;
 case 'toggle-categories-edit':tpOtherEditingCategories=!tpOtherEditingCategories;tpOtherAddingCategory=false;tpOtherDeletingCategory=null;tpOtherCategoryScroll=0;break;
 case 'add-category':tpOtherAddingCategory=true;tpOtherDeletingCategory=null;break;
 case 'cancel-add-category':tpOtherAddingCategory=false;break;
 case 'delete-category':tpOtherDeletingCategory=name;tpOtherAddingCategory=false;break;
 case 'cancel-delete-category':tpOtherDeletingCategory=null;break;
 case 'confirm-delete-category':{
  if(cl.categories.length<2){toast('至少保留一個分類');return;}
  const old=tpOtherDeletingCategory,to=cl.categories.find(c=>c!==old);
  if(!old||!to)return;
  cl.tasks.forEach(t=>{if(t.category===old)t.category=to;});
  cl.categories=cl.categories.filter(c=>c!==old);
  if(tpOtherSelectedCategory===old)tpOtherSelectedCategory=to;
  tpOtherDeletingCategory=null;tpOtherCategoryScroll=0;persist();break;
 }
 case 'delete-task':cl.tasks=cl.tasks.filter(t=>t.id!==id);persist();break;
 case 'new-ticket':tpOtherTicketFormOpen=true;tpOtherEditingTicket=null;tpOtherSelectedTicket=null;tpOtherImageData='';break;
 case 'cancel-ticket':tpOtherTicketFormOpen=false;tpOtherEditingTicket=null;tpOtherImageData='';break;
 case 'select-ticket':tpOtherSelectedTicket=tpOtherSelectedTicket===id?null:id;tpOtherTicketFormOpen=false;break;
 case 'edit-ticket':tpOtherTicketFormOpen=true;tpOtherEditingTicket=tpOtherSelectedTicket;tpOtherImageData='';break;
 case 'delete-ticket':data.travelTickets=tpOtherTickets().filter(t=>t.id!==tpOtherSelectedTicket);tpOtherSelectedTicket=null;persist();break;
 default:return;
 }
 tpOtherRefresh();
 if(action==='add-category')$('tpOtherCategoryForm')?.querySelector('input')?.focus();
}

function tpOtherNearestCategory(view,x){
 const b=view.getBoundingClientRect();let selected=-1,best=Infinity;
 view.querySelectorAll('.tp-other-editcat').forEach((el,i)=>{
  const r=el.getBoundingClientRect();if(r.right<=b.left||r.left>=b.right)return;
  const mid=(Math.max(r.left,b.left)+Math.min(r.right,b.right))/2,dist=Math.abs(mid-x);
  if(dist<best){selected=i;best=dist;}
 });
 return selected;
}
function tpOtherDragPreview(g,x){
 const r=g.view.getBoundingClientRect(),xx=Math.max(r.left+23,Math.min(r.right-23,x));
 const ghost=$('tpOtherDragGhost');if(!ghost)return;
 ghost.style.left=xx+'px';ghost.style.top=(r.top+r.height/2)+'px';
 g.to=tpOtherNearestCategory(g.view,xx);
 g.view.querySelectorAll('.tp-other-editcat').forEach((el,i)=>{
  el.classList.toggle('source',i===g.from);
  el.classList.toggle('target',i===g.to&&i!==g.from);
 });
}
document.addEventListener('pointerdown',ev=>{
 if(!tpOtherEditingCategories||tpOtherOpen!=='list'||ev.target.closest('.tp-other-cat-delete'))return;
 const el=ev.target.closest('[data-tp-other-drag]'),view=ev.target.closest('#tpOtherCatViewport');
 if(!el||!view)return;
 clearTimeout(tpOtherSnapTimer);
 const g={id:ev.pointerId,x:ev.clientX,y:ev.clientY,view,start:view.scrollLeft,from:tpOtherChecklist().categories.indexOf(el.dataset.tpOtherDrag),to:-1,mode:'pending',timer:null};
 if(g.from<0)return;tpOtherGesture=g;
 g.timer=setTimeout(()=>{
  if(tpOtherGesture!==g||g.mode!=='pending')return;
  g.mode='drag';g.to=g.from;g.lock=view.scrollLeft;
  const ghost=$('tpOtherDragGhost');if(ghost){ghost.textContent=tpOtherChecklist().categories[g.from];ghost.hidden=false;}
  try{view.setPointerCapture(g.id);}catch{}
  tpOtherDragPreview(g,g.x);
 },250);
},true);
document.addEventListener('pointermove',ev=>{
 const g=tpOtherGesture;if(!g||ev.pointerId!==g.id)return;
 const dx=ev.clientX-g.x,dy=ev.clientY-g.y;
 if(g.mode==='pending'&&(Math.abs(dx)>8||Math.abs(dy)>9)){clearTimeout(g.timer);g.mode='scroll';}
 if(g.mode==='scroll'){ev.preventDefault();g.view.scrollLeft=g.start-dx;tpOtherCategoryScroll=g.view.scrollLeft;}
 if(g.mode==='drag'){ev.preventDefault();g.view.scrollLeft=g.lock;tpOtherDragPreview(g,ev.clientX);}
},{passive:false});
document.addEventListener('pointerup',ev=>{
 const g=tpOtherGesture;if(!g||ev.pointerId!==g.id)return;
 clearTimeout(g.timer);tpOtherGesture=null;
 const ghost=$('tpOtherDragGhost');if(ghost)ghost.hidden=true;
 if(g.mode==='drag'){
  tpOtherBlockedClickUntil=Date.now()+450;
  if(g.to>=0&&g.to!==g.from){
   const cl=tpOtherChecklist(),cat=cl.categories.splice(g.from,1)[0];
   cl.categories.splice(g.to,0,cat);persist();
  }
  tpOtherCategoryScroll=g.view.scrollLeft;tpOtherRefresh();
 }else if(g.mode==='scroll'){tpOtherBlockedClickUntil=Date.now()+300;tpOtherSnapCategory(g.view);}
},true);
document.addEventListener('pointercancel',ev=>{
 if(tpOtherGesture?.id!==ev.pointerId)return;
 clearTimeout(tpOtherGesture.timer);tpOtherGesture=null;
 const ghost=$('tpOtherDragGhost');if(ghost)ghost.hidden=true;
 tpOtherRefresh();
},true);

/* B5 date-only drag: tap selects, short swipe scrolls; 250 ms hold reorders whole days. */
// Six visible dates; snap to a whole-date boundary without changing selection.
function tpManageDateSnapTarget(left,unit,count,active=-1){
 if(!(unit>0)||count<=6)return 0;
 let start=Math.round(left/unit);
 if(active>=0)start=Math.max(active-5,Math.min(active,start));
 return Math.max(0,Math.min(count-6,start))*unit;
}
function setupManageDayDrag(strip){
 if(!strip)return;
 const layer=strip.closest('.modal-back');
 if(!layer)return;
 const ghost=document.createElement('div');
 ghost.className='tp26m-day-ghost';
 ghost.hidden=true;
 ghost.setAttribute('aria-hidden','true');
 ghost.innerHTML='<small></small><b></b>';
 layer.appendChild(ghost);
 let gesture=null,holdTimer=null,snapTimer=null,snapEndTimer=null,aligning=false;
 function cancelSnap(){
   clearTimeout(snapTimer);clearTimeout(snapEndTimer);aligning=false;
 }
 function scheduleSnap(keepSelected=false){
   clearTimeout(snapTimer);
   snapTimer=setTimeout(()=>{
     if(!strip.isConnected||gesture||aligning)return;
     const chips=[...strip.querySelectorAll('.tp26m-day')];
     const unit=chips[0]?.getBoundingClientRect().width||0;
     const active=keepSelected?chips.findIndex(el=>el.classList.contains('active')):-1;
     const target=tpManageDateSnapTarget(strip.scrollLeft,unit,chips.length,active);
     if(Math.abs(target-strip.scrollLeft)<.5)return;
     aligning=true;
     strip.scrollTo({left:target,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
     snapEndTimer=setTimeout(()=>{aligning=false;},450);
   },180);
 }
 // Opening/selecting a date reveals it, then gently settles onto six complete slots.
 const chips=[...strip.querySelectorAll('.tp26m-day')];
 const active=chips.findIndex(el=>el.classList.contains('active'));
 const unit=chips[0]?.getBoundingClientRect().width||0;
 strip.scrollLeft=Math.max(0,(active-2.5)*unit);
 scheduleSnap(true);
 function clearHold(){if(holdTimer!==null){clearTimeout(holdTimer);holdTimer=null;}}
 function clean(){
   clearHold();gesture=null;ghost.hidden=true;strip.classList.remove('tp26m-dragging');
   strip.querySelectorAll('.tp26m-day').forEach(el=>el.classList.remove('tp26m-source','tp26m-target'));
 }
 function nearest(x){
   const rect=strip.getBoundingClientRect(),cx=Math.max(rect.left+3,Math.min(rect.right-3,x));
   let target=-1,distance=Infinity;
   strip.querySelectorAll('.tp26m-day').forEach((el,i)=>{
     const r=el.getBoundingClientRect();
     if(r.right<=rect.left||r.left>=rect.right)return;
     const mid=(Math.max(r.left,rect.left)+Math.min(r.right,rect.right))/2;
     const d=Math.abs(mid-cx);
     if(d<distance){distance=d;target=i;}
   });
   return target;
 }
 function moveGhost(x){
   const g=gesture;if(!g||g.mode!=='drag')return;
   if(strip.scrollLeft!==g.lockScroll)strip.scrollLeft=g.lockScroll;
   const r=strip.getBoundingClientRect();
   ghost.style.left=Math.max(r.left+26,Math.min(r.right-26,x))+'px';
   ghost.style.top=(r.top+r.height/2)+'px'; // 0 px vertical movement.
   g.to=nearest(x);
   strip.querySelectorAll('.tp26m-day').forEach((el,i)=>{
     el.classList.toggle('tp26m-source',i===g.from);
     el.classList.toggle('tp26m-target',i===g.to&&i!==g.from);
   });
 }
 function startDrag(){
   const g=gesture;
   if(!g||g.mode!=='pending'||!strip.isConnected)return;
   g.mode='drag';g.lockScroll=strip.scrollLeft;
   const w=tpManageWeek(data.days[g.from]?.date);
   ghost.querySelector('small').textContent=w.weekday;
   ghost.querySelector('b').textContent=w.num;
   strip.classList.add('tp26m-dragging');ghost.hidden=false;
   moveGhost(g.lastX);
   try{if(navigator.vibrate)navigator.vibrate(15);}catch(_){}
 }
 strip.addEventListener('pointerdown',e=>{
   if(e.button!==0||e.isPrimary===false||gesture)return;
   const chip=e.target.closest('.tp26m-day');
   if(!chip||!strip.contains(chip))return;
   e.preventDefault();
   cancelSnap();strip.scrollTo({left:strip.scrollLeft,behavior:'auto'});
   gesture={id:e.pointerId,from:Number(chip.dataset.action.split(':')[1]),startX:e.clientX,startY:e.clientY,lastX:e.clientX,startScroll:strip.scrollLeft,lockScroll:0,to:-1,mode:'pending'};
   try{strip.setPointerCapture(e.pointerId);}catch(_){}
   holdTimer=setTimeout(()=>{holdTimer=null;startDrag();},250);
 });
 strip.addEventListener('pointermove',e=>{
   const g=gesture;if(!g||g.id!==e.pointerId)return;
   e.preventDefault();g.lastX=e.clientX;
   if(g.mode==='pending'){
     const dx=e.clientX-g.startX,dy=e.clientY-g.startY;
     if(Math.abs(dx)>9&&Math.abs(dx)>Math.abs(dy)*.7){clearHold();g.mode='scroll';}
     else if(Math.abs(dy)>17){clearHold();g.mode='cancel';}
   }
   if(g.mode==='scroll')strip.scrollLeft=g.startScroll-(e.clientX-g.startX);
   else if(g.mode==='drag')moveGhost(e.clientX);
 });
 strip.addEventListener('pointerup',e=>{
   const g=gesture;if(!g||g.id!==e.pointerId)return;
   if(g.mode==='pending'){
     const from=g.from;clean();
     if(from>=0&&from<data.days.length){day=from;render();openModal(manageTripPanel());}
   }else if(g.mode==='drag'){
     moveGhost(e.clientX);
     const from=g.from,to=g.to;
     clean();
     if(to<0||to===from||from<0||from>=data.days.length||to>=data.days.length){scheduleSnap();return;}
     const dates=data.days.map(d=>d.date);
     const moved=data.days.splice(from,1)[0];
     data.days.splice(to,0,moved);
     data.days.forEach((d,i)=>{d.date=dates[i];});
     day=to;
     persist();render();openModal(manageTripPanel());
   }else{clean();scheduleSnap();}
 });
 strip.addEventListener('pointercancel',()=>{clean();scheduleSnap();});
 strip.addEventListener('scroll',()=>{
   if(gesture?.mode==='drag'){
     if(strip.scrollLeft!==gesture.lockScroll)strip.scrollLeft=gesture.lockScroll;
     return;
   }
   if(!gesture&&!aligning)scheduleSnap();
 },{passive:true});
 for(const name of ['contextmenu','selectstart','dragstart'])strip.addEventListener(name,e=>e.preventDefault());
 // Pointer-up handles taps. Suppress the synthesized click so it cannot select an old day after reorder.
 strip.addEventListener('click',e=>{
   if(e.detail!==0){e.preventDefault();e.stopImmediatePropagation();}
 },true);
}

  else if(action==='deleteLink'){const i=+idx;if(Number.isInteger(i)&&i>=0&&i<data.favs.length&&confirm('確定刪除這個連結？')){data.favs.splice(i,1);persist();render();openModal(manageLinksPanel());toast('已刪除連結');}}
  else if(action==='weather'){if(!loc)locate();else{weatherDetails=!weatherDetails;render();}}
  else if(action==='nearby'){page='nearby';render();if(!loc)locate();}
  else if(action==='askLocationPermission'){openLocationPermissionSettings();}
  else if(action==='relocate'){if($('overlay').innerHTML)closeModal();locate();}
  else if(action==='openGoogleNearby')window.open(nearbyGoogleUrl(),'_blank','noopener');
  else if(action==='addStop')stopForm();
  else if(action==='editStop')stopForm(+idx);
  else if(action==='delStop'){const i=+idx;if(Number.isInteger(i)&&data.days[day]?.stops[i]&&confirm('確定刪除這個地點？')){data.days[day].stops.splice(i,1);persist();render();openModal(manageTripPanel());}}
  else if(action==='addDay'){
    const base=new Date((data.days[day]?.date||new Date().toISOString().slice(0,10))+'T12:00:00Z');
    const d=Number.isFinite(base.getTime())?base:new Date();d.setUTCDate(d.getUTCDate()+1);
    if(data.days.length>=500){toast('已達行程上限');return;}
    data.days.push({date:d.toISOString().slice(0,10),stops:[]});
    day=data.days.length-1;persist();render();openModal(manageTripPanel());
  }
  else if(action==='deleteDay'){
    if(data.days.length<=1){toast('至少要保留一天行程');return;}
    const removed=data.days[day];if(!removed)return;
    const shifted=data.days.slice(day+1).map(entry=>{
      const value=String(entry.date||'');
      if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return null;
      const dateObj=new Date(value+'T12:00:00Z');
      if(!Number.isFinite(dateObj.getTime())||dateObj.toISOString().slice(0,10)!==value)return null;
      dateObj.setUTCDate(dateObj.getUTCDate()-1);
      return dateObj.toISOString().slice(0,10);
    });
    if(shifted.some(x=>!x)){toast('後續日期格式有誤，請先編輯修正日期');return;}
    const count=(removed.stops||[]).length;
    if(!confirm('確定刪除 '+String(removed.date||'此日期')+' 的整天行程？\n該日 '+count+' 個地點及備註都會被刪除，之後所有日期會自動提前一天。\n刪除後不能直接復原，建議先匯出 JSON 備份。'))return;
    const removedIndex=day;
    data.days.splice(removedIndex,1);
    for(let i=removedIndex;i<data.days.length;i++)data.days[i].date=shifted[i-removedIndex];
    day=Math.min(removedIndex,data.days.length-1);
    persist();render();openModal(manageTripPanel());toast('已刪除整天行程，後續日期已提前一天');
  }
  else if(action==='editDay')dayForm();
  else if(action==='capture'||action==='gallery'){filePicker('image/*',action==='capture',async file=>{try{const blob=await prepareImage(file);receiptForm(blob,file.name);}catch(err){toast(err.message);}});}
  else if(action==='viewReceipt')viewReceipt(+idx);
  else if(action==='receiptFullscreen')openReceiptFullscreen(+idx);
  else if(action==='editReceipt')editReceipt(+idx);
  else if(action==='deleteReceipt')deleteReceipt(+idx);
  else if(action==='export')exportJSON();
  else if(action==='import')filePicker('.json,application/json',false,async file=>{
    try{
      const imported=JSON.parse(await file.text());
      if(!imported||!Array.isArray(imported.days)||imported.days.length>500||!imported.days.every(d=>d&&typeof d==='object'&&(d.stops===undefined||Array.isArray(d.stops)))||(imported.favs!==undefined&&(!Array.isArray(imported.favs)||imported.favs.length>500)))throw Error('格式不正確');
      if(!confirm('匯入會覆蓋目前的本機行程、酒店及常用連結，確定？'))return;
      imported.favs=Array.isArray(imported.favs)?imported.favs:[];
      imported.days=imported.days.length?imported.days:[{date:new Date().toISOString().slice(0,10),name:'新行程',stops:[]}];
      for(const d of imported.days)if(!Array.isArray(d.stops))d.stops=[];
      data=imported;day=0;persist();closeModal();render();toast('已成功匯入舊版或新版 JSON');
    }catch(err){toast('匯入失敗：'+err.message);}
  });
  else if(action==='reset'){if(confirm('確定還原示範行程？這會覆蓋現有酒店、連結和行程設定。')){data=structuredClone(initial);day=0;persist();closeModal();render();}}
});

 data.navPrefs={station:['google','walk'].includes(candidate.station)?candidate.station:'google',food:['google','tabelog'].includes(candidate.food)?candidate.food:'google',spot:['google','walk'].includes(candidate.spot)?candidate.spot:'google'};

 e.preventDefault();const f=new FormData(e.target);
 const name=String(f.get('name')||'').trim().slice(0,100),address=String(f.get('address')||'').trim().slice(0,350),raw=String(f.get('url')||'').trim();
 if(raw&&!safeUrl(raw)){toast('請輸入有效的酒店網址');return;}

 data.hotel={name,address,url:raw};
 persist();render();openModal(settingsPanel());toast('酒店資料已儲存');
}else if(e.target.id==='linkForm'){
 e.preventDefault();const f=new FormData(e.target);
 const name=String(f.get('name')||'').trim().slice(0,80),note=String(f.get('note')||'').trim().slice(0,180),url=normalizeLinkUrl(f.get('url'));
 if(!name||!url){toast('請輸入名稱及有效的 http/https 網址');return;}
 if(editingLink===null){if(data.favs.length>=500){toast('連結數量已達上限');return;}data.favs.push({name,url,note});}
 else if(data.favs[editingLink])data.favs[editingLink]={name,url,note};
 else {toast('此連結已不存在');return;}
 persist();render();openModal(manageLinksPanel());toast('連結已儲存');
}else if(e.target.id==='stopForm'){
 e.preventDefault();const f=new FormData(e.target),type=String(f.get('type')||'');
 if(!['station','food','spot'].includes(type)){toast('請選擇車站、美食或景點');return;}
 const previous=editingStop===null?null:data.days[day].stops[editingStop];
 if(editingStop!==null&&!previous){toast('地點已不存在');return;}
 const item={id:previous?.id||crypto.randomUUID(),time:String(f.get('time')||'12:00'),name:String(f.get('name')||'').trim().slice(0,120),type,note:String(f.get('note')||'').trim().slice(0,500),url:String(f.get('url')||'').trim()};
 if(!item.name)return toast('請輸入地點名稱');

let lastLocationAt=0,autoLocationPending=false;
function rememberLocation(value){try{localStorage.setItem('tp-auto-location',value?'1':'0');}catch{}}
function locationOptIn(){try{return localStorage.getItem('tp-auto-location')==='1';}catch{return false;}}
function markLocationPrompted(){try{localStorage.setItem('tp-location-prompted','1');}catch{}}
function locationPrompted(){try{return localStorage.getItem('tp-location-prompted')==='1';}catch{return false;}}
function openLocationPermissionSettings(){
  // Request native location permission and keep the result visible in this sheet.
  tpLocationPermissionMessage(locationBusy?'正在取得位置，請稍候…':'正在向瀏覽器請求位置權限…');
  if(locationBusy)return;
  markLocationPrompted();
  void locate().catch(err=>{
    locationBusy=false;
    tpLocationPermissionMessage('無法啟動定位：'+(err?.message||'請檢查瀏覽器位置權限'));
  });
}
function showLocationPermissionChoice(){
  if(!window.isSecureContext||!navigator.geolocation||locationPrompted()||loc||document.hidden||locationBusy)return;
  markLocationPrompted();
  locate();
}
async function resumeLocation(){
  if(document.hidden||locationBusy||autoLocationPending||Date.now()-lastLocationAt<5*60000)return;
  autoLocationPending=true;
  try{
    let state='unknown';
    if(navigator.permissions?.query){try{state=(await navigator.permissions.query({name:'geolocation'})).state;}catch{}}
    if(state==='denied'){rememberLocation(false);markLocationPrompted();return;}
    if(state==='granted'){markLocationPrompted();locate();return;}
    if(state==='prompt'||state==='unknown'){
      if(!locationPrompted()&&!loc)showLocationPermissionChoice();
      else if(locationOptIn())locate();
    }
  }finally{autoLocationPending=false;}
}
function syncViewport(){const v=window.visualViewport;document.documentElement.style.setProperty('--visual-height',(v?.height||window.innerHeight)+'px');document.documentElement.style.setProperty('--visual-top',(v?.offsetTop||0)+'px');}
window.visualViewport?.addEventListener('resize',syncViewport);
window.visualViewport?.addEventListener('scroll',syncViewport);

document.addEventListener('visibilitychange',()=>{if(!document.hidden){resumeLocation();refreshSpecialInfoIfDue();tpMapRefreshActiveIfDue();}});
setInterval(refreshSpecialInfoIfDue,15*60*1000);
syncViewport();resumeLocation();
