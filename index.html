async function loadReceipts(){

 const list=$('receiptList');
 try{
  const records=cloudMode()?await cloudList():await localReceipt('getAll');
  if(page!=='receipts'||$('receiptList')!==list)return;
  receiptCache=records;
  receiptCache.sort((a,b)=>String(b.date).localeCompare(String(a.date)));

  $('receiptSync').textContent=cloudMode()?'已從 Cloudflare R2 讀取':'本機儲存 · 尚未同步雲端';
  releaseReceiptThumbnails();
  list.innerHTML=receiptCache.length?receiptCache.map((r,i)=>{
   const src=receiptThumbSrc(r);
   return `<button class="place receipt-list-item" data-action="viewReceipt:${i}"><div class="row"><div class="receipt-thumb">${src?'<img src="'+escapeHtml(src)+'" alt="收據縮圖" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false">':''}<span class="receipt-thumb-fallback" ${src?'hidden':''}>${icon('receipt','big')}</span></div><div class="grow"><b>${escapeHtml(r.shop||'未命名收據')}</b><small>${escapeHtml(new Date(r.date).toLocaleString('zh-HK'))}</small><small>${escapeHtml(r.note||'')}</small></div>${icon('chevron')}</div></button>`;
  }).join(''):'<div class="empty">未有收據。按「直接拍照」開始儲存。</div>';
 }catch(e){if(page==='receipts'&&$('receiptList')===list){list.innerHTML='<p class="error">讀取收據失敗：'+escapeHtml(e.message)+'</p>';$('receiptSync').textContent='同步失敗';}}

async function queryNearby(){

 e.preventDefault();const f=new FormData(e.target);
 const name=String(f.get('name')||'').trim().slice(0,80),note=String(f.get('note')||'').trim().slice(0,180),url=normalizeLinkUrl(f.get('url'));
 if(!name||!url){toast('請輸入名稱及有效的 http/https 網址');return;}
 if(editingLink===null){if(data.favs.length>=500){toast('連結數量已達上限');return;}data.favs.push({name,url,note});}
 else if(data.favs[editingLink])data.favs[editingLink]={name,url,note};
 else {toast('此連結已不存在');return;}
 persist();render();openModal(manageLinksPanel());toast('連結已儲存');
}else if(e.target.id==='stopForm'){
 e.preventDefault();const f=new FormData(e.target),type=String(f.get('type')||'');
 if(!['station','food','spot'].includes(type)){toast('請選擇車站、美食或景點');return;}
 const previous=editingStop===null?null:data.days[day].stops[editingStop];
 if(editingStop!==null&&!previous){toast('地點已不存在');return;}
 const item={id:previous?.id||crypto.randomUUID(),time:String(f.get('time')||'12:00'),name:String(f.get('name')||'').trim().slice(0,120),type,note:String(f.get('note')||'').trim().slice(0,500),url:String(f.get('url')||'').trim()};
 if(!item.name)return toast('請輸入地點名稱');
 if(item.url&&!safeUrl(item.url)){toast('請輸入有效的 http/https 網址');return;}
 if(editingStop===null)data.days[day].stops.push(item);else data.days[day].stops[editingStop]=item;
 persist();render();openModal(manageTripPanel());toast('地點已儲存');
}else if(e.target.id==='dayForm'){
 e.preventDefault();const f=new FormData(e.target);
 data.days[day].date=String(f.get('date')||'');
 data.days[day].name=String(f.get('name')||'').trim().slice(0,90);
 persist();render();openModal(manageTripPanel());toast('日期及名稱已更新');
}else if(e.target.id==='editReceiptForm'){
 e.preventDefault();const i=Number(e.target.dataset.receiptIndex);const submit=e.target.querySelector('button[type=submit]');submit.disabled=true;submit.textContent='儲存中…';
 try{const f=new FormData(e.target);await updateReceipt(i,String(f.get('shop')||'').trim(),String(f.get('note')||'').trim());closeModal();loadReceipts();toast('收據資料已更新');}
 catch(err){toast(err.message);submit.disabled=false;submit.textContent='重試儲存';}
}else if(e.target.id==='receiptForm'){
 e.preventDefault();const submit=e.target.querySelector('button[type=submit]');submit.disabled=true;submit.textContent='正在儲存…';
 try{const f=new FormData(e.target);await saveReceipt(window.pendingReceipt,String(f.get('shop')).trim(),String(f.get('note')).trim());window.pendingReceipt=null;closeModal();page='receipts';render();toast('收據已儲存');}
 catch(err){toast(err.message);submit.disabled=false;submit.textContent='重試儲存';}
}
});render();
let lastLocationAt=0,autoLocationPending=false;
function rememberLocation(value){try{localStorage.setItem('tp-auto-location',value?'1':'0');}catch{}}
function locationOptIn(){try{return localStorage.getItem('tp-auto-location')==='1';}catch{return false;}}
function markLocationPrompted(){try{localStorage.setItem('tp-location-prompted','1');}catch{}}
function locationPrompted(){try{return localStorage.getItem('tp-location-prompted')==='1';}catch{return false;}}
function openLocationPermissionSettings(){
 openModal('<div class="tp-location-intro"><div class="tp-location-symbol">'+icon('pin')+'</div><h2>重新詢問位置權限</h2><p class="muted">按下「要求定位」後，網站會向瀏覽器提出位置請求。如果尚未作出選擇，瀏覽器通常會顯示允許／拒絕提示。</p><p class="muted">如果你之前已允許，瀏覽器可能直接使用原有權限；如果之前已封鎖，網站無法強制重新彈出系統提示，請在 Safari／Chrome 的網站設定或 iPhone「設定」中更改位置權限。</p><div class="actions"><button class="btn primary" data-action="allowLocation">要求定位</button><button class="btn" data-action="close">取消</button></div></div>');
}
function showLocationPermissionChoice(){
  if(!window.isSecureContext||!navigator.geolocation||locationPrompted()||loc||document.hidden||$('overlay').innerHTML)return;
  openModal('<div class="tp-location-intro"><div class="tp-location-symbol">'+icon('pin')+'</div><h2>允許 Travel Pocket 使用你的位置？</h2><p class="muted">用於顯示當地天氣、附近車站及便利店，並計算距離。按下「允許定位」後，瀏覽器會詢問你是否允許此網站取得位置。</p><div class="actions"><button class="btn primary" data-action="allowLocation">允許定位</button><button class="btn" data-action="skipLocation">暫時不要</button></div><p class="muted" style="font-size:12px">你可以隨時在右上角設定選擇「重新詢問權限」。已允許或封鎖的權限須由瀏覽器管理。</p></div>');
}

async function resumeLocation(){
  if(document.hidden||locationBusy||autoLocationPending||Date.now()-lastLocationAt<60000)return;
  autoLocationPending=true;
  try{
    let state='unknown';
    if(navigator.permissions?.query){try{state=(await navigator.permissions.query({name:'geolocation'})).state;}catch{}}
    if(state==='denied'){rememberLocation(false);markLocationPrompted();return;}
    if(state==='granted'||locationOptIn()){markLocationPrompted();locate();return;}
    if(state==='prompt'||state==='unknown')showLocationPermissionChoice();
  }finally{autoLocationPending=false;}
}
function syncViewport(){const v=window.visualViewport;document.documentElement.style.setProperty('--visual-height',(v?.height||window.innerHeight)+'px');document.documentElement.style.setProperty('--visual-top',(v?.offsetTop||0)+'px');}
window.visualViewport?.addEventListener('resize',syncViewport);
window.visualViewport?.addEventListener('scroll',syncViewport);
window.addEventListener('pageshow',()=>{resumeLocation();refreshSpecialInfoIfDue();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){resumeLocation();refreshSpecialInfoIfDue();}});
setInterval(refreshSpecialInfoIfDue,15*60*1000);
syncViewport();resumeLocation();
if(specialInfoTestPoint||specialInfoDemo)fetchSpecialInfo();
