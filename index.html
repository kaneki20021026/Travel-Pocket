/* iOS/PWA settings sheet: one viewport-anchored layer, no svh clipping. */
body.modal-open{overflow:hidden!important}
body.modal-open .nav,body.modal-open .header{visibility:hidden!important}
#overlay:not(:empty){
 position:fixed!important;inset:0!important;z-index:2000!important;
 width:auto!important;height:auto!important;overflow:visible!important;pointer-events:auto;
}
#overlay .modal-back{
 position:absolute!important;
 top:0!important;right:0!important;left:0!important;
 bottom:calc(-1 * env(safe-area-inset-bottom,0px))!important;
 inset:0 0 calc(-1 * env(safe-area-inset-bottom,0px)) 0!important;
 width:auto!important;height:auto!important;min-height:0!important;max-height:none!important;
 box-sizing:border-box;display:flex;align-items:center;justify-content:center;
 padding:calc(env(safe-area-inset-top,0px) + 10px) 12px
         calc(env(safe-area-inset-bottom,0px) + 10px)!important;
 background:rgba(40,79,116,.78)!important;
 -webkit-backdrop-filter:none!important;backdrop-filter:none!important;
 overflow:hidden;overscroll-behavior:contain;
}
#overlay .modal.tp-settings-modal{
 flex:0 1 auto;align-self:center;min-width:0;min-height:0!important;
 width:min(100%,440px);max-width:440px;
 height:85%!important;max-height:85%!important;
 margin:0 auto;padding:15px 16px 12px;
 display:flex;flex-direction:column;overflow:hidden!important;
 background:linear-gradient(145deg,#eff8ff,#dceefd)!important;
 -webkit-backdrop-filter:none!important;backdrop-filter:none!important;
 box-shadow:0 12px 36px #143e6440,inset 0 1px 0 #fff;isolation:isolate;
}
#overlay .modal.tp-settings-modal>.row:first-child{
 flex:0 0 auto!important;position:relative!important;top:auto!important;z-index:2;
 display:flex;align-items:center;justify-content:space-between;

}

}

 }

/* Keep the settings glass sheet below the upper iOS system compositing zone. */
@media (display-mode: standalone){
 #overlay .modal.tp-settings-modal{
   transform:translateY(clamp(12px,2.2dvh,22px));
 }
}
/* iPhone Home Screen: shift page content, never the fixed bottom dock.
   WebKit may report installed apps as fullscreen instead of standalone (bug 264218).
   tp-home-screen is a navigator.standalone fallback for iOS. */
/* Ordinary browser: 10px extra space below the safe area. */
.app{padding-top:calc(env(safe-area-inset-top,0px) + 10px)!important}
/* Installed iPhone app: 40px extra space; dock stays fixed. */
html.tp-home-screen .app{padding-top:calc(env(safe-area-inset-top,0px) + 26px)!important}
@media (display-mode: standalone), (display-mode: fullscreen){
  .app{padding-top:calc(env(safe-area-inset-top,0px) + 26px)!important}
}

async function fetchJmaJson(url){

function jmaOfficeFor(class20,areas){
 let code=String(class20);
 for(let i=0;i<5;i++){
  if(areas.offices?.[code])return code;
  const entry=areas.class20s?.[code]||areas.class15s?.[code]||areas.class10s?.[code];
  if(!entry?.parent)return '';
  code=String(entry.parent);
 }
 return '';
}
function jmaNearestArea(position,areas,xy){
 const rad=Math.PI/180,lat=position.lat*rad,lng=position.lng*rad;
 let best=null;
 for(const [code,coordinates] of Object.entries(xy.class20s||{})){
  if(!areas.class20s?.[code]||!Array.isArray(coordinates)||coordinates.length<2)continue;
  const a=Number(coordinates[0])*rad,b=Number(coordinates[1])*rad;
  if(!Number.isFinite(a)||!Number.isFinite(b))continue;
  const dLat=a-lat,dLng=b-lng;
  const h=Math.sin(dLat/2)**2+Math.cos(lat)*Math.cos(a)*Math.sin(dLng/2)**2;
  const distance=6371*2*Math.asin(Math.min(1,Math.sqrt(h)));
  if(!best||distance<best.km)best={code,km:distance,name:areas.class20s[code].name};
 }
 if(!best||best.km>75)return null;
 const office=jmaOfficeFor(best.code,areas);
 return office?{...best,office}:null;
}
function jmaActiveWarnings(reports,areaCode){
 if(!Array.isArray(reports)||!reports.length)throw Error('警報資料格式不符');
 let incomplete=false,recent=0;
 const active=new Map();
 for(const report of reports){
  if(!report||!report.warning||!Array.isArray(report.warning.class20Items)){incomplete=true;continue;}
  const stamp=Date.parse(report.reportDatetime||'');
  if(Number.isFinite(stamp))recent=Math.max(recent,stamp);
  const item=report.warning.class20Items.find(row=>String(row.areaCode)===areaCode);
  if(!item||!Array.isArray(item.kinds)||!item.kinds.length){incomplete=true;continue;}
  for(const kind of item.kinds){
   const status=kind?.status,code=String(kind?.code||'');
   if(status==='発表'||status==='継続'){
    if(!code){incomplete=true;continue;}
    const known=jmaWarningNames[code];
    active.set(code,{label:known?.[0]||'未識別警報（'+code+'）',priority:known?.[1]||1});
    if(!known)incomplete=true;
   }else if(status!=='解除'&&status!=='発表警報・注意報はなし'){
    incomplete=true;
   }
  }
 }
 if(!recent||recent>Date.now()+3600000||Date.now()-recent>60*86400000)incomplete=true;
 return {active:[...active.values()].sort((a,b)=>b.priority-a.priority),incomplete};
}
function localQuakeSummary(rows,point){
 if(!Array.isArray(rows))throw Error('地震資料格式不符');
 const seen=new Set(),now=Date.now(),events=[];
 for(const row of rows){
  if(!row||!row.eid||seen.has(row.eid))continue;
  const timestamp=Date.parse(row.at||'');
  if(!Number.isFinite(timestamp)||timestamp>now+300000||now-timestamp>24*3600000)continue;
  const match=String(row.cod||'').match(/^([+-]\d+(?:\.\d+)?)([+-]\d+(?:\.\d+)?)/);
  if(!match)continue;
  const toDegrees=value=>{const v=Math.abs(Number(value)),deg=Math.floor(v/100);return Math.sign(Number(value))*(deg+(v-deg*100)/60);};
  const lat=toDegrees(match[1]),lng=toDegrees(match[2]);
  if(!Number.isFinite(lat)||!Number.isFinite(lng))continue;
  const rad=Math.PI/180,a=point.lat*rad,b=lat*rad;
  const h=Math.sin((b-a)/2)**2+Math.cos(a)*Math.cos(b)*Math.sin((lng-point.lng)*rad/2)**2;
  const km=6371*2*Math.asin(Math.min(1,Math.sqrt(h)));
  if(km>150)continue;
  seen.add(row.eid);
  events.push({timestamp,region:String(row.anm||'震央附近'),maxi:String(row.maxi||'')});
 }
 events.sort((a,b)=>b.timestamp-a.timestamp);
 return events[0]||null;
}
async function fetchSpecialInfo(){

 if(!loc&&!specialInfoTestPoint)return;
 const point=specialInfoTestPoint||{lat:loc.lat,lng:loc.lng},request=++specialInfoRequest;
 specialInfoCheckedAt=Date.now();
 setSpecialInfo('正在查詢地震、暴雨及暴雪…');
 if(point.lat<20||point.lat>46.5||point.lng<122||point.lng>155){
  setSpecialInfo('目前只支援日本地區資訊');return;
 }
 const testPrefix=specialInfoTestPoint?'【'+specialInfoTestLabel+'模擬】':'';
 const items=[],links=[];
 let failed=false,areaName=placeName||'附近地區';
 const [weatherResult,quakeResult]=await Promise.allSettled([
  (async()=>{
   const [areas,xy]=await jmaAreaData();
   const nearest=jmaNearestArea(point,areas,xy);
   if(!nearest)throw Error('找不到對應地區');
   const reports=await fetchJmaJson('https://www.jma.go.jp/bosai/warning/data/r8/'+nearest.office+'.json');
   const result=jmaActiveWarnings(reports,nearest.code);
   return {nearest,result};
  })(),
  fetchJmaJson('https://www.jma.go.jp/bosai/quake/data/list.json')
 ]);
 if(request!==specialInfoRequest)return;
 if(weatherResult.status==='fulfilled'){
  const {nearest,result}=weatherResult.value;
  areaName=String(nearest.name||areaName);
  const relevant=result.active.filter(w=>/^(大雨|大雪|暴風雪)/.test(w.label));
  for(const warning of relevant.slice(0,2)){
   items.push(areaName+' · '+warning.label);
  }
  if(result.incomplete)failed=true;
  links.push('https://www.jma.go.jp/bosai/warning/#lang=ja&area_type=offices&area_code='+nearest.office);
 }else{failed=true;console.warn('Travel Pocket warning:',weatherResult.reason);}
 if(quakeResult.status==='fulfilled'){
  try{
   const quake=localQuakeSummary(quakeResult.value,point);
   if(quake){
    const label=quake.region.replace(/県/g,'縣').replace(/東京都/g,'東京').replace(/北海道/g,'北海道').replace(/近海/g,'近海');
    items.unshift(label+' · 地震'+(quake.maxi?' 震度'+quake.maxi:''));
    links.unshift('https://www.jma.go.jp/bosai/quake/');
   }
  }catch(error){failed=true;console.warn('Travel Pocket quake parse:',error);}
 }else{failed=true;console.warn('Travel Pocket quake:',quakeResult.reason);}
 if(items.length){
  setSpecialInfo(testPrefix+items.join(' ｜ ')+(failed?' · 部分資料未核實':''),links[0]);
 }else if(failed){
  setSpecialInfo(testPrefix+areaName+' · 資料暫未能完整確認');
 }else{
  setSpecialInfo('暫時沒有資訊');
 }
}

function tpFlightConfig(dir){
 const fallback=tpFlightInfo[dir];
 const saved=data.flightPrefs?.[dir]||{};
 const code=String(saved.code||fallback.code).trim().toUpperCase().replace(/\s+/g,'');
 const date=String(saved.date||fallback.date.replace(/\//g,'-'));
 return {code,date,original:fallback};
}

function tpFlightApiKey(){try{return localStorage.getItem('tp-aerodatabox-key')||'';}catch{return '';}}

function tpFlightMode(){try{return localStorage.getItem('tp-flight-api-mode')||'rapid';}catch{return 'rapid';}}

function tpFlightWorkerUrl(){try{return localStorage.getItem('tp-flight-worker-url')||'';}catch{return '';}}

function tpFlightConfigured(){return tpFlightMode()==='worker'?!!tpFlightWorkerUrl():!!tpFlightApiKey();}

function tpFlightReadCache(){
 let obj={};
 try{obj=JSON.parse(localStorage.getItem('tp-flight-cache-v1')||'{}')||{};}catch{}
 const age=7*24*60*60*1000;
 for(const dir of ['out','back'])if(obj[dir]&&(!Number.isFinite(obj[dir].fetchedAt)||Date.now()-obj[dir].fetchedAt>age||obj[dir].fetchedAt>Date.now()+3600000))delete obj[dir];
 return obj;
}

function tpFlightStatusLabel(status,quality){
 const state=String(status||'').toLowerCase().replace(/[^a-z]/g,'');
 const names={arrived:'已抵達',departed:'已起飛',enroute:'飛行中',active:'飛行中',airborne:'飛行中',boarding:'登機中',checkin:'辦理登機',delayed:'延誤',cancelled:'已取消',canceled:'已取消',diverted:'已轉降',expected:'預計起飛',scheduled:'預定航班',unknown:'待確認'};
 return names[state]||(status?String(status):quality?.includes('Live')?'已更新':'預定航班');
}

function tpFlightLocalTime(value){
 const raw=String(value?.local||'');
 return raw.match(/(?:T| )(\d{2}:\d{2})/)?.[1]||'';
}

function tpFlightCheckIn(value){
 if(!value)return '待公布';
 const parts=String(value).toUpperCase().split(/[,\s;/]+/).map(s=>s.replace(/[^A-Z]/g,'')).filter(s=>/^[A-Z]{1,2}$/.test(s));
 return [...new Set(parts)].join('、')||'待公布';
}

async function tpFlightMaybeRefresh(force=false,dir=tpFlightDirection){
 const cfg=tpFlightConfig(dir);
 if(!tpFlightConfigured()||tpFlightPending[dir]||!/^([A-Z0-9]{2,4})\d{1,5}[A-Z]?$/.test(cfg.code)||!/^\d{4}-\d\d-\d\d$/.test(cfg.date))return;
 const key=cfg.code+'|'+cfg.date,cache=tpFlightReadCache()[dir];
 const now=Date.now();
 const days=(Date.parse(cfg.date+'T00:00:00Z')-now)/86400000;
 if(days>366||days < -366){tpFlightProblem[dir]='航班日期超出 API 的前後 365 天查詢範圍';return;}
 const ttl=days>7?24*3600000:days>1?6*3600000:days>=-1?30*60000:24*3600000;
 if(!force&&cache?.query===key&&now-cache.fetchedAt<ttl)return;
 if(!force&&tpFlightRetryAt[dir]>now)return;
 if(force&&now-tpFlightManualAt[dir]<30000){toast('請至少相隔 30 秒再重新查詢');return;}
 if(force)tpFlightManualAt[dir]=now;
 tpFlightPending[dir]=true;tpFlightProblem[dir]='';
 try{
  let url,headers={'Accept':'application/json'};
  if(tpFlightMode()==='worker'){
   url=new URL(tpFlightWorkerUrl());
   url.searchParams.set('flight',cfg.code);url.searchParams.set('date',cfg.date);
  }else{
   url='https://aerodatabox.p.rapidapi.com/flights/number/'+encodeURIComponent(cfg.code)+'/'+cfg.date+'?withAircraftImage=false&withLocation=false';
   headers['X-RapidAPI-Host']='aerodatabox.p.rapidapi.com';headers['X-RapidAPI-Key']=tpFlightApiKey();
  }
  const response=await fetch(url,{method:'GET',headers,cache:'no-store'});
  const body=await response.text();let payload;
  try{payload=JSON.parse(body);}catch{throw Error('API 回傳非 JSON 資料（HTTP '+response.status+'）');}
  if(!response.ok)throw Error('HTTP '+response.status+'：'+String(payload.message||payload.error||'請檢查 API 額度與設定').slice(0,180));
  const list=Array.isArray(payload)?payload:Array.isArray(payload.response)?payload.response:Array.isArray(payload.flights)?payload.flights:[payload];
  const matches=list.filter(x=>x&&typeof x==='object'&&x.departure&&x.arrival);
  const chosen=matches.find(x=>x.departure?.airport?.iata===cfg.original.from&&x.arrival?.airport?.iata===cfg.original.to)||matches[0]||null;
  const full=tpFlightReadCache();full[dir]={query:key,flight:chosen,fetchedAt:Date.now()};
  localStorage.setItem('tp-flight-cache-v1',JSON.stringify(full));
  tpFlightRetryAt[dir]=0;
  if(force)toast(chosen?'航班查詢成功':'查詢成功，但暫無此航班資料');
 }catch(err){
  tpFlightProblem[dir]=String(err?.message||err).includes('Failed to fetch')?'無法連接 API，可能是網絡或 CORS 限制':String(err?.message||err);
  tpFlightRetryAt[dir]=Date.now()+15*60000;
  if(force)toast('航班 API：'+tpFlightProblem[dir]);
 }finally{
  tpFlightPending[dir]=false;
  if(page==='home')render();
  if(document.getElementById('tpFlightSettingsForm'))openModal(settingsPanel());
 }
}

const tpFx={source:'JPY',raw:'10000',rate:null,date:'',status:'loading',acc:null,op:null,waiting:false,finished:false,history:'',error:'',percentLabel:'',firstEntry:true};

function tpFxFormat(s){if(!s)return '';const neg=s.startsWith('-'),p=(neg?s.slice(1):s).split('.');return (neg?'-':'')+p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',')+(p.length>1?'.'+p.slice(1).join(''):'');}

function tpFxConvert(n,from){return tpFx.rate===null?null:(from==='JPY'?n*tpFx.rate:n/tpFx.rate);}

 for(const cur of ['JPY','HKD']){const active=cur===s.source;inputs[cur].readOnly=!active;$('fxv6-'+cur.toLowerCase()+'box').classList.toggle('active',active);$('fxv6-'+cur.toLowerCase()+'clear').hidden=!active||s.raw==='';}

function tpFxInit(){

async function tpFxRate(){
 const s=tpFx,key='travelPocketJpyHkdRateV1';
 try{const cache=JSON.parse(localStorage.getItem(key)||'null');if(cache&&Number.isFinite(cache.rate)&&cache.rate>0&&cache.date){s.rate=cache.rate;s.date=cache.date;s.status='cached';tpFxRender();}}catch{}
 const sources=[
  {url:'https://open.er-api.com/v6/latest/JPY',parse:j=>({rate:Number(j?.rates?.HKD),date:j?.time_last_update_utc?new Date(j.time_last_update_utc).toISOString().slice(0,10):new Date().toISOString().slice(0,10)})},
  {url:'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/jpy.json',parse:j=>({rate:Number(j?.jpy?.hkd),date:j?.date})},
  {url:'https://api.frankfurter.app/latest?from=JPY&to=HKD',parse:j=>({rate:Number(j?.rates?.HKD),date:j?.date})}
 ];
 for(const source of sources){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),5500);
  try{
   const response=await fetch(source.url,{signal:controller.signal,cache:'no-store'});
   if(!response.ok)throw Error('rate HTTP '+response.status);
   const result=source.parse(await response.json());
   if(!Number.isFinite(result.rate)||result.rate<=0||typeof result.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(result.date))throw Error('invalid rate');
   s.rate=result.rate;s.date=result.date;s.status='live';
   try{localStorage.setItem(key,JSON.stringify({rate:s.rate,date:s.date}));}catch{}
   tpFxRender();return;
  }catch(err){/* Try the next public reference-rate provider. */}
  finally{clearTimeout(timer);}
 }
 s.status=s.rate===null?'unavailable':'cached';tpFxRender();
}

/* B5 date-only drag: tap selects, short swipe scrolls; 250 ms hold reorders whole days. */
function setupManageDayDrag(strip){
 if(!strip)return;
 const layer=strip.closest('.modal-back');
 if(!layer)return;
 const ghost=document.createElement('div');
 ghost.className='tp26m-day-ghost';
 ghost.hidden=true;
 ghost.setAttribute('aria-hidden','true');
 ghost.innerHTML='<small></small><b></b>';
 layer.appendChild(ghost);
 let gesture=null,holdTimer=null;
 function clearHold(){if(holdTimer!==null){clearTimeout(holdTimer);holdTimer=null;}}
 function clean(){
   clearHold();gesture=null;ghost.hidden=true;strip.classList.remove('tp26m-dragging');
   strip.querySelectorAll('.tp26m-day').forEach(el=>el.classList.remove('tp26m-source','tp26m-target'));
 }
 function nearest(x){
   const rect=strip.getBoundingClientRect(),cx=Math.max(rect.left+3,Math.min(rect.right-3,x));
   let target=-1,distance=Infinity;
   strip.querySelectorAll('.tp26m-day').forEach((el,i)=>{
     const r=el.getBoundingClientRect();
     if(r.right<=rect.left||r.left>=rect.right)return;
     const mid=(Math.max(r.left,rect.left)+Math.min(r.right,rect.right))/2;
     const d=Math.abs(mid-cx);
     if(d<distance){distance=d;target=i;}
   });
   return target;
 }
 function moveGhost(x){
   const g=gesture;if(!g||g.mode!=='drag')return;
   if(strip.scrollLeft!==g.lockScroll)strip.scrollLeft=g.lockScroll;
   const r=strip.getBoundingClientRect();
   ghost.style.left=Math.max(r.left+26,Math.min(r.right-26,x))+'px';
   ghost.style.top=(r.top+r.height/2)+'px'; // 0 px vertical movement.
   g.to=nearest(x);
   strip.querySelectorAll('.tp26m-day').forEach((el,i)=>{
     el.classList.toggle('tp26m-source',i===g.from);
     el.classList.toggle('tp26m-target',i===g.to&&i!==g.from);
   });
 }
 function startDrag(){
   const g=gesture;
   if(!g||g.mode!=='pending'||!strip.isConnected)return;
   g.mode='drag';g.lockScroll=strip.scrollLeft;
   const w=tpManageWeek(data.days[g.from]?.date);
   ghost.querySelector('small').textContent=w.weekday;
   ghost.querySelector('b').textContent=w.num;
   strip.classList.add('tp26m-dragging');ghost.hidden=false;
   moveGhost(g.lastX);
   try{if(navigator.vibrate)navigator.vibrate(15);}catch(_){}
 }
 strip.addEventListener('pointerdown',e=>{
   if(e.button!==0||e.isPrimary===false||gesture)return;
   const chip=e.target.closest('.tp26m-day');
   if(!chip||!strip.contains(chip))return;
   e.preventDefault();
   gesture={id:e.pointerId,from:Number(chip.dataset.action.split(':')[1]),startX:e.clientX,startY:e.clientY,lastX:e.clientX,startScroll:strip.scrollLeft,lockScroll:0,to:-1,mode:'pending'};
   try{strip.setPointerCapture(e.pointerId);}catch(_){}
   holdTimer=setTimeout(()=>{holdTimer=null;startDrag();},250);
 });
 strip.addEventListener('pointermove',e=>{
   const g=gesture;if(!g||g.id!==e.pointerId)return;
   e.preventDefault();g.lastX=e.clientX;
   if(g.mode==='pending'){
     const dx=e.clientX-g.startX,dy=e.clientY-g.startY;
     if(Math.abs(dx)>9&&Math.abs(dx)>Math.abs(dy)*.7){clearHold();g.mode='scroll';}
     else if(Math.abs(dy)>17){clearHold();g.mode='cancel';}
   }
   if(g.mode==='scroll')strip.scrollLeft=g.startScroll-(e.clientX-g.startX);
   else if(g.mode==='drag')moveGhost(e.clientX);
 });
 strip.addEventListener('pointerup',e=>{
   const g=gesture;if(!g||g.id!==e.pointerId)return;
   if(g.mode==='pending'){
     const from=g.from;clean();
     if(from>=0&&from<data.days.length){day=from;render();openModal(manageTripPanel());}
   }else if(g.mode==='drag'){
     moveGhost(e.clientX);
     const from=g.from,to=g.to;
     clean();
     if(to<0||to===from||from<0||from>=data.days.length||to>=data.days.length)return;
     const dates=data.days.map(d=>d.date);
     const moved=data.days.splice(from,1)[0];
     data.days.splice(to,0,moved);
     data.days.forEach((d,i)=>{d.date=dates[i];});
     day=to;
     persist();render();openModal(manageTripPanel());
   }else clean();
 });
 strip.addEventListener('pointercancel',clean);
 strip.addEventListener('scroll',()=>{
   if(gesture?.mode==='drag'&&strip.scrollLeft!==gesture.lockScroll)strip.scrollLeft=gesture.lockScroll;
 });
 for(const name of ['contextmenu','selectstart','dragstart'])strip.addEventListener(name,e=>e.preventDefault());
 // Pointer-up handles taps. Suppress the synthesized click so it cannot select an old day after reorder.
 strip.addEventListener('click',e=>{
   if(e.detail!==0){e.preventDefault();e.stopImmediatePropagation();}
 },true);
}

function haversine(a,b,c,d){const R=6371000,toRad=x=>x*Math.PI/180,dl=toRad(c-a),dn=toRad(d-b);const x=Math.sin(dl/2)**2+Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(dn/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}function distText(n){return Math.round(n).toLocaleString('en-US')+' m';}let locationBusy=false,weatherBusy=false;
async function resolvePlaceName(position){
 const {lat,lng}=position;
 try{
  const res=await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+encodeURIComponent(lat)+'&longitude='+encodeURIComponent(lng)+'&localityLanguage=zh',{cache:'no-store'});
  if(!res.ok)throw Error('地名查詢失敗');
  const j=await res.json();
  const parts=[j.locality||j.city||j.principalSubdivision,j.principalSubdivision].filter(Boolean);
  const name=[...new Set(parts)].join(' · ')||j.countryName||'';
  if(loc?.lat!==lat||loc?.lng!==lng)return;
  placeName=name||lat.toFixed(4)+', '+lng.toFixed(4);
 }catch{
  if(loc?.lat!==lat||loc?.lng!==lng)return;
  placeName=lat.toFixed(4)+', '+lng.toFixed(4);
 }
 const label=document.querySelector('.compact-weather .weather-location-label');
 if(label)label.textContent=placeName;
}
async function locate(){
  if(locationBusy)return;
  if(!window.isSecureContext){toast('定位需要 HTTPS 網址');return;}
  if(!navigator.geolocation){toast('瀏覽器不支援 GPS 定位');return;}
  locationBusy=true;
  const status=$('nearStatus');if(status)status.textContent='正在向瀏覽器取得位置…';
  navigator.geolocation.getCurrentPosition(p=>{
    locationBusy=false;
    const nextLoc={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:Number.isFinite(p.coords.accuracy)?p.coords.accuracy:null};
    if(!Number.isFinite(nextLoc.lat)||!Number.isFinite(nextLoc.lng))return toast('取得無效座標，請重新定位');
    loc=nextLoc;placeName='';lastLocationAt=Date.now();rememberLocation(true);resolvePlaceName(nextLoc);
    const googleLink=$('googleNearbyLink');if(googleLink)googleLink.href=nearbyGoogleUrl();
    if(page==='nearby')render();
    if(page==='home')render();
    fetchWeather();
    fetchSpecialInfo();
  },err=>{
    locationBusy=false;
    if(err.code===1){rememberLocation(false);markLocationPrompted();}

async function fetchWeather(){

  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lng)}&current=temperature_2m,wind_speed_10m,precipitation,weather_code&hourly=precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=5&timezone=auto`;

    const chances=j.hourly?.precipitation_probability||[];

    weather={current:j.current,daily:j.daily,rain:j.current.precipitation>0||(maxChance!==null&&maxChance>=40),rainChance:maxChance};

}

async function queryNearby(){
  if(!loc||page!=='nearby')return;
  const requestId=++nearbyRequest;
  if(nearbyAbortController)nearbyAbortController.abort();
  nearbyAbortController=new AbortController();
  const signal=nearbyAbortController.signal;
  const status=$('nearStatus'),list=$('nearList');
  if(status)status.textContent='GPS 已定位 · 正在查詢附近商店…';
  if(list)list.innerHTML='<div class="empty">正在連接 OpenStreetMap 店舖資料服務…<div class="notice" style="margin-top:8px">如果搜尋較慢，可使用上方的 Google Maps 搜尋按鈕。</div></div>';

  const q=`[out:json][timeout:16];(node["${tag}"="${value}"](around:${radius},${loc.lat},${loc.lng});way["${tag}"="${value}"](around:${radius},${loc.lat},${loc.lng});relation["${tag}"="${value}"](around:${radius},${loc.lat},${loc.lng}););out center;`;

  const servers=[
    {name:'Private.coffee',url:'https://overpass.private.coffee/api/interpreter',method:'GET'},
    {name:'FOSSGIS',url:'https://overpass-api.de/api/interpreter',method:'POST'}
  ];
  let responseJson=null,lastError=null;
  for(let i=0;i<servers.length;i++){
    if(requestId!==nearbyRequest||page!=='nearby'||signal.aborted)return;
    const server=servers[i];
    if(status)status.textContent='GPS 已定位 · '+(i===0?'搜尋附近地點…':'第一個服務未回應，嘗試備用來源…');
    const timerCtrl=new AbortController();
    const onAbort=()=>timerCtrl.abort();
    signal.addEventListener('abort',onAbort,{once:true});
    const timer=setTimeout(()=>timerCtrl.abort(),i===0?9000:10000);
    try{
      const opts={method:server.method,signal:timerCtrl.signal,cache:'no-store',referrerPolicy:'strict-origin-when-cross-origin'};
      const endpoint=server.method==='GET'?server.url+'?data='+encodeURIComponent(q):server.url;
      if(server.method==='POST')opts.body=new URLSearchParams({data:q});
      const r=await fetch(endpoint,opts);
      if(!r.ok)throw Error(server.name+'：HTTP '+r.status);
      const body=await r.json();
      if(body.remark)throw Error(server.name+'：搜尋未完成，請重試');
      if(!Array.isArray(body.elements))throw Error(server.name+'：資料格式錯誤');

      if(signal.aborted||requestId!==nearbyRequest)return;

    }
  }
  if(requestId!==nearbyRequest||page!=='nearby'||signal.aborted)return;
  if(!responseJson){
    nearby=[];
    if(status)status.textContent='GPS 已定位 · 店舖資料服務暫時無法連線';
    if(list)list.innerHTML='<div class="empty">OpenStreetMap 店舖資料目前未能載入。<div class="actions" style="justify-content:center">'+button('重試搜尋','retryNearby')+button('在 Google Maps 尋找'+selected[1],'openGoogleNearby','primary')+'</div><div class="notice">'+escapeHtml(lastError?.name==='AbortError'?'服務連線逾時':lastError?.message||'網絡連線問題')+'</div></div>';
    return;
  }
  const seen=new Set();
  nearby=responseJson.elements.map(e=>{
    const lat=e.lat??e.center?.lat,lng=e.lon??e.center?.lon;
    if(!Number.isFinite(lat)||!Number.isFinite(lng))return null;

  }).filter(Boolean).filter(p=>p.distance<=radius).filter(p=>{

    if(seen.has(k))return false;seen.add(k);return true;
  }).sort((a,b)=>a.distance-b.distance).slice(0,80);
  if(status)status.textContent='GPS 已定位 · 找到 '+nearby.length+' 個'+selected[1]+'地點';
  if(list)list.innerHTML=nearby.length?nearby.map((p,i)=>`<button class="place" data-action="navigate:${i}"><div class="row">${icon(category)}<div class="grow"><b>${escapeHtml(p.name)}</b><small>${escapeHtml(p.address)}</small><small class="distance">距離約 ${distText(p.distance)}（直線） · 點擊步行導航</small></div>${icon('nav')}</div></button>`).join(''):'<div class="empty">此搜尋範圍內沒有已登記的'+escapeHtml(selected[1])+'。<div class="actions" style="justify-content:center">'+button('在 Google Maps 搜尋','openGoogleNearby','primary')+'</div></div>';
}

let lastLocationAt=0,autoLocationPending=false;
function rememberLocation(value){try{localStorage.setItem('tp-auto-location',value?'1':'0');}catch{}}
function locationOptIn(){try{return localStorage.getItem('tp-auto-location')==='1';}catch{return false;}}
function markLocationPrompted(){try{localStorage.setItem('tp-location-prompted','1');}catch{}}
function locationPrompted(){try{return localStorage.getItem('tp-location-prompted')==='1';}catch{return false;}}
function openLocationPermissionSettings(){
  // Browser-managed geolocation permission: no custom permission dialog.
  markLocationPrompted();
  locate();
}
function showLocationPermissionChoice(){
  if(!window.isSecureContext||!navigator.geolocation||locationPrompted()||loc||document.hidden||locationBusy)return;
  markLocationPrompted();
  locate();
}
async function resumeLocation(){
  if(document.hidden||locationBusy||autoLocationPending||Date.now()-lastLocationAt<60000)return;
  autoLocationPending=true;
  try{
    let state='unknown';
    if(navigator.permissions?.query){try{state=(await navigator.permissions.query({name:'geolocation'})).state;}catch{}}
    if(state==='denied'){rememberLocation(false);markLocationPrompted();return;}
    if(state==='granted'){markLocationPrompted();locate();return;}
    if(state==='prompt'||state==='unknown'){
      if(!locationPrompted()&&!loc)showLocationPermissionChoice();
      else if(locationOptIn())locate();
    }
  }finally{autoLocationPending=false;}
}
function syncViewport(){const v=window.visualViewport;document.documentElement.style.setProperty('--visual-height',(v?.height||window.innerHeight)+'px');document.documentElement.style.setProperty('--visual-top',(v?.offsetTop||0)+'px');}
window.visualViewport?.addEventListener('resize',syncViewport);
window.visualViewport?.addEventListener('scroll',syncViewport);
window.addEventListener('pageshow',()=>{resumeLocation();refreshSpecialInfoIfDue();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){resumeLocation();refreshSpecialInfoIfDue();}});
setInterval(refreshSpecialInfoIfDue,15*60*1000);
syncViewport();resumeLocation();
if(specialInfoTestPoint||specialInfoDemo)fetchSpecialInfo();
